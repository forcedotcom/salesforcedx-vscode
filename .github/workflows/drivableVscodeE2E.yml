name: Drivable VS Code macOS E2E (Playwright)

on:
  workflow_dispatch:
  push:
    branches-ignore: [ main, develop ]
    paths:
      - 'packages/drivable-vscode/**'
      - 'packages/playwright-vscode-ext/**'
      - '.github/workflows/drivableVscodeE2E.yml'

jobs:
  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CI: 1
      PLAYWRIGHT_VSCODE_VERSION: ${{ vars.PLAYWRIGHT_VSCODE_VERSION || 'stable' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-e2e
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
      - run: pnpm --filter @salesforce/drivable-vscode test:desktop -- --retries 0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drivable-vscode-macos-playwright
          path: |
            packages/drivable-vscode/test-results
            packages/drivable-vscode/playwright-report
