name: Build Release from Prerelease

on:
  schedule:
    # Mondays at 8 AM UTC (5 days after Wednesday pre-release promotion)
    # Builds stable release from pre-release that has been tested by customers
    # Gives ~5 day baking period (Wed pre-release → Mon stable release)
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      prereleaseTag:
        description: 'Promoted prerelease tag (e.g., v67.11.1-nightly.develop.20260812). Leave empty to auto-detect latest.'
        required: false
        type: string
      releaseVersion:
        description: 'Release version (e.g., 67.12.0). Leave empty to auto-calculate (bump minor from prerelease).'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-release:
    name: 'Build Release from Prerelease'
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.calculate-version.outputs.version }}
      prerelease_tag: ${{ steps.detect-tag.outputs.tag }}
      release_tag: ${{ steps.calculate-version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for tags
          token: ${{ secrets.IDEE_GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}

      - name: Detect promoted prerelease tag
        id: detect-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.prereleaseTag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            # Validate input tag format to prevent command injection
            if ! echo "$INPUT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.develop\.[0-9]{8}$'; then
              echo "::error::Invalid tag format: $INPUT_TAG"
              echo "::error::Expected format: v{major}.{minor}.{patch}-nightly.develop.{YYYYMMDD}"
              echo "::error::Example: v67.11.1-nightly.develop.20260812"
              exit 1
            fi
            TAG="$INPUT_TAG"
            echo "Using provided tag: $TAG"
          else
            # Find latest nightly tag (promoted prereleases use this pattern)
            # Sort by version, take most recent
            TAG=$(git tag -l 'v*-nightly.develop.*' --sort=-v:refname | head -1)

            if [ -z "$TAG" ]; then
              echo "::error::No nightly prerelease tags found. Expected pattern: v*-nightly.develop.*"
              exit 1
            fi

            echo "Auto-detected latest nightly tag: $TAG"
          fi

          # Verify tag exists (use double quotes for safety)
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG does not exist"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Calculate release version
        id: calculate-version
        run: |
          VERSION=$(node scripts/calculate-release-version.js \
            "${{ steps.detect-tag.outputs.tag }}" \
            "${{ github.event.inputs.releaseVersion }}")

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Preserve scripts before checkout
        run: |
          # Copy scripts to temp location (prerelease tag may not have them)
          mkdir -p /tmp/release-scripts
          cp scripts/calculate-release-version.js /tmp/release-scripts/
          cp scripts/update-release-versions.js /tmp/release-scripts/

          # Generate checksums for integrity verification
          sha256sum scripts/calculate-release-version.js scripts/update-release-versions.js > /tmp/release-scripts/checksums.txt
          echo "Generated checksums:"
          cat /tmp/release-scripts/checksums.txt

      - name: Checkout prerelease tag
        run: |
          echo "Checking out prerelease tag: ${{ steps.detect-tag.outputs.tag }}"
          git checkout "${{ steps.detect-tag.outputs.tag }}"

      - name: Restore scripts
        run: |
          # Restore scripts from temp location
          mkdir -p scripts

          # Verify scripts exist in temp
          if [ ! -f /tmp/release-scripts/calculate-release-version.js ] || [ ! -f /tmp/release-scripts/update-release-versions.js ]; then
            echo "::error::Scripts not found in /tmp/release-scripts/"
            exit 1
          fi

          cp /tmp/release-scripts/calculate-release-version.js scripts/
          cp /tmp/release-scripts/update-release-versions.js scripts/

          # Verify integrity with checksums
          cd scripts
          if ! sha256sum -c /tmp/release-scripts/checksums.txt 2>/dev/null; then
            echo "::error::Script integrity check failed - checksums do not match"
            exit 1
          fi
          cd ..
          echo "✓ Script integrity verified"

      - name: Configure git
        uses: ./.github/actions/gitConfig
        with:
          email: ${{ secrets.IDEE_GH_EMAIL }}

      - name: Update package versions
        run: node scripts/update-release-versions.js ${{ steps.calculate-version.outputs.version }}

      - name: Install dependencies with updated versions
        uses: salesforcecli/github-workflows/.github/actions/npmInstallWithRetries@main

      - name: Build VSIXs
        run: npm run vscode:package

      - name: Collect VSIXs
        run: |
          mkdir -p extensions
          find packages -name "*.vsix" -type f -exec cp {} ./extensions \;

          # Validate that VSIXs were built
          VSIX_COUNT=$(ls -1 ./extensions/*.vsix 2>/dev/null | wc -l)
          if [ "$VSIX_COUNT" -eq 0 ]; then
            echo "::error::No VSIX files found after build. Build may have failed silently."
            exit 1
          fi
          echo "✓ Found $VSIX_COUNT VSIX files"

      - name: Generate SHA256 checksums
        run: |
          npm run vscode:sha256
          scripts/concatenate-sha256.js
          rm ./SHA256

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
          RELEASE_VERSION: ${{ steps.calculate-version.outputs.version }}
          RELEASE_TAG: ${{ steps.calculate-version.outputs.release_tag }}
          PRERELEASE_TAG: ${{ steps.detect-tag.outputs.tag }}
        run: |
          echo "Creating GitHub pre-release: $RELEASE_TAG"

          # Create release notes
          {
            echo "## Release $RELEASE_VERSION"
            echo ""
            echo "Built from promoted prerelease: \`$PRERELEASE_TAG\`"
            echo ""
            echo "### Testing Required"
            echo ""
            echo "This is a pre-release for internal testing only. Do NOT publish to marketplace until testing is complete."
            echo ""
            echo "### Testing Checklist"
            echo ""
            echo "1. Download VSIX files from this release"
            echo "2. Install extensions locally"
            echo "3. Run manual QA tests"
            echo "4. If tests PASS - Trigger publishVSCode.yml workflow with version $RELEASE_VERSION"
            echo "5. If tests FAIL - Create immediate prerelease, bump version, and retry"
            echo ""
            echo "### Installation"
            echo ""
            echo '```bash'
            echo "gh release download $RELEASE_TAG"
            echo 'find . -name "*.vsix" -exec code --install-extension {} \;'
            echo '```'
          } > release_notes.md

          # Check if release already exists (for retry scenarios)
          if gh release view "$RELEASE_TAG" &> /dev/null; then
            echo "⚠️  Release $RELEASE_TAG already exists. Deleting for retry..."
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag

            # Wait for GitHub API to propagate the deletion (eventual consistency)
            echo "Waiting for deletion to propagate..."
            sleep 5

            # Verify deletion completed with timeout
            DELETED=false
            for i in {1..5}; do
              if ! gh release view "$RELEASE_TAG" &> /dev/null; then
                echo "✓ Release deleted successfully"
                DELETED=true
                break
              fi
              echo "Waiting for deletion to complete (attempt $i/5)..."
              sleep 3
            done

            # Fail if deletion didn't complete
            if [ "$DELETED" = false ]; then
              echo "::error::Release deletion timed out after 20 seconds"
              echo "::error::GitHub API may be experiencing delays. Please try again later."
              exit 1
            fi
          fi

          # Create pre-release first (without assets)
          gh release create "$RELEASE_TAG" \
            --title "Release $RELEASE_VERSION - Ready for Testing" \
            --notes-file release_notes.md \
            --prerelease

          # Upload VSIX files
          echo "Uploading VSIX files..."
          for vsix in ./extensions/*.vsix; do
            echo "Uploading $(basename "$vsix")..."
            gh release upload "$RELEASE_TAG" "$vsix"
          done

          # Upload SHA256
          echo "Uploading SHA256.md..."
          gh release upload "$RELEASE_TAG" SHA256.md

          echo "Pre-release created: $RELEASE_TAG"
          echo "View at: https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"

  summary:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## ✅ Release Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Version:** ${{ needs.build-release.outputs.release_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** ${{ needs.build-release.outputs.release_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Source:** ${{ needs.build-release.outputs.prerelease_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download and test VSIX files from the pre-release" >> $GITHUB_STEP_SUMMARY
          echo "2. If tests pass, trigger \`publishVSCode.yml\` workflow" >> $GITHUB_STEP_SUMMARY
          echo "3. If tests fail, create immediate prerelease and retry with bumped version" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Pre-release](https://github.com/${{ github.repository }}/releases/tag/${{ needs.build-release.outputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
