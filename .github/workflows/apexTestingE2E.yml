name: Apex Testing E2E (Playwright)

on:
  workflow_dispatch:
    inputs:
      vscode_version:
        description: 'VS Code version for E2E (e.g. 1.116.0). Empty uses repo variable
          PLAYWRIGHT_VSCODE_VERSION.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      vscode_version:
        description: 'VS Code version for E2E (e.g. 1.116.0). Empty uses repo variable
          PLAYWRIGHT_VSCODE_VERSION.'
        required: false
        type: string
        default: ''
  push:
    branches-ignore: [ main, develop ]
    paths-ignore:
      - CONTEXT.md
      - CONTEXT-MAP.md
      - '**/CONTEXT.md'
      - 'docs/**.md'
      - '**/docs/**.md'
      - '.claude/**.md'
      - 'plans/**.md'
      - '.cursor/**.md'

concurrency:
  group: ci-${{ github.ref }}-apexTestingE2E
  cancel-in-progress: true

jobs:
  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        lane: [ org-wide, class-scoped, ride-along ]
      fail-fast: false
    env:
      NON_TRACKING_ORG_ALIAS: nonTrackingTestOrg
      MINIMAL_ORG_ALIAS: minimalTestOrg
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_E2E }}
      PLAYWRIGHT_VSCODE_VERSION: ${{ github.event_name != 'push' &&
        inputs.vscode_version != '' && inputs.vscode_version ||
        vars.PLAYWRIGHT_VSCODE_VERSION }}
    steps:
      - uses: $/.github/actions/playwright-e2e
        with:
          workspace: packages/salesforcedx-vscode-apex-testing
          npm-script: test:web:${{ matrix.lane }}
          scratch-orgs: ${{ matrix.lane == 'ride-along' && 'minimal' || 'non-tracking' }}
          sf-cli-version: ${{ vars.SF_CLI_VERSION || 'latest' }}
          recreate-org-on-retry: 'true'
          compile-playwright-utils: 'true'
          report-name: playwright-report-apex-testing-web-${{ matrix.lane }}
          results-name: playwright-test-results-apex-testing-web-${{ matrix.lane }}
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
  e2e-desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
        lane: [ org-wide, class-scoped, ride-along ]
      fail-fast: false

    env:
      NON_TRACKING_ORG_ALIAS: nonTrackingTestOrg
      MINIMAL_ORG_ALIAS: minimalTestOrg
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_E2E }}
      VSCODE_DESKTOP: 1
      E2E_FROM_VSIX: 1
      PLAYWRIGHT_VSCODE_VERSION: ${{ github.event_name != 'push' &&
        inputs.vscode_version != '' && inputs.vscode_version ||
        vars.PLAYWRIGHT_VSCODE_VERSION }}
    steps:
      - uses: $/.github/actions/playwright-e2e
        with:
          workspace: packages/salesforcedx-vscode-apex-testing
          npm-script: test:desktop:${{ matrix.lane }}
          scratch-orgs: ${{ matrix.lane == 'ride-along' && 'minimal' || 'non-tracking' }}
          sf-cli-version: ${{ vars.SF_CLI_VERSION || 'latest' }}
          recreate-org-on-retry: 'true'
          compile-playwright-utils: 'true'
          report-name: playwright-report-apex-testing-desktop-${{ matrix.os }}-${{ matrix.lane }}
          results-name: playwright-test-results-apex-testing-desktop-${{ matrix.os }}-${{ matrix.lane }}
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
