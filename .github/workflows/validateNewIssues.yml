name: 'Validate New Issues'
on:
  issues:
    types: [opened]

jobs:
  validate-new-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
          install: 'false'
      - name: Install dependencies
        uses: salesforcecli/github-workflows/.github/actions/pnpmInstallWithRetries@main
      - name: Compile effect-octokit
        run: pnpm --filter @salesforce/effect-octokit compile
      - name: Check whether to process the issue
        id: check_feature_request
        uses: ./.github/actions/check-feature-request
        with:
          repo-token: ${{ secrets.IDEE_GH_TOKEN }}
      - name: Post issue acknowledgement
        id: issue_comment
        uses: ./.github/actions/new-issue
        with:
          repo-token: ${{ secrets.IDEE_GH_TOKEN }}
          should-process-issue: ${{ steps.check_feature_request.outputs.should_process_issue }}
      - name: Validate issue
        id: validate-issue
        uses: ./.github/actions/validate-issue
        with:
          repo-token: ${{ secrets.IDEE_GH_TOKEN }}
          should-process-issue: ${{ steps.check_feature_request.outputs.should_process_issue }}
