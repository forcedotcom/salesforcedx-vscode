name: Commit Workflow
on:
  push:
    branches-ignore: [main, develop]
    paths-ignore:
      - CONTEXT.md
      - CONTEXT-MAP.md
      - '**/CONTEXT.md'
      - 'docs/**.md'
      - '**/docs/**.md'
      - '.claude/**.md'
      - 'plans/**.md'
      - '.cursor/**.md'

jobs:
  build-and-test:
    uses: ./.github/workflows/buildAndTest.yml
