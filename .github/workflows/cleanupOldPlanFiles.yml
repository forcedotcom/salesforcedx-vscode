name: Cleanup Old Plan Files

on:
  workflow_dispatch:
    inputs:
      base-ref:
        description: Branch to clean up
        required: true
        default: develop
        type: string
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: cleanup-old-plan-files
  cancel-in-progress: false

jobs:
  cleanup-old-plan-files:
    name: Delete old plan files
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE_REF: ${{ inputs['base-ref'] || 'develop' }}
    steps:
      - name: Checkout base branch with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_REF }}
          fetch-depth: 0
          token: ${{ secrets.IDEE_GH_TOKEN }}

      - name: Select old plan files
        run: |
          set -euo pipefail

          if [[ "$(git rev-parse --is-shallow-repository)" != false ]]; then
            echo 'Full Git history is required.' >&2
            exit 1
          fi

          tracked="$RUNNER_TEMP/tracked-plan-files"
          recent="$RUNNER_TEMP/recent-plan-files"
          deletion="$RUNNER_TEMP/plan-files-to-delete"
          actual="$RUNNER_TEMP/actual-plan-file-changes"
          untracked="$RUNNER_TEMP/untracked-files"
          cutoff="$(date -u -d '14 days ago' +%s)"

          LC_ALL=C git ls-files -z -- '.claude/plans/*.md' |
            LC_ALL=C sort -zu > "$tracked"
          LC_ALL=C git log --since="@$cutoff" --name-only --format= -z \
            --diff-filter=ACMR -- '.claude/plans/*.md' |
            LC_ALL=C sort -zu > "$recent"
          LC_ALL=C comm -z -23 "$tracked" "$recent" > "$deletion"

          if [[ -s "$deletion" ]]; then
            git rm --pathspec-from-file="$deletion" --pathspec-file-nul
          else
            echo 'No old plan files found.'
          fi

          LC_ALL=C git diff --cached --name-only --no-renames -z -- |
            LC_ALL=C sort -zu > "$actual"
          cmp --silent "$deletion" "$actual"
          git diff --cached --quiet --no-renames --diff-filter=ACMRTUXB --
          git diff --quiet --
          git ls-files --others --exclude-standard -z > "$untracked"
          test ! -s "$untracked"

      - name: Select pull request branch
        id: pull-request
        run: |
          set -euo pipefail
          if [[ "$BASE_REF" == develop ]]; then
            echo 'branch=automated/cleanup-old-plan-files' >> "$GITHUB_OUTPUT"
          else
            echo 'branch=automated/cleanup-old-plan-files-verification' >> "$GITHUB_OUTPUT"
          fi

      - name: Get Github user info
        id: github-user-info
        uses: salesforcecli/github-workflows/.github/actions/getGithubUserInfo@main
        with:
          SVC_CLI_BOT_GITHUB_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}

      - uses: salesforcecli/github-workflows/.github/actions/gitConfig@main
        with:
          username: ${{ steps.github-user-info.outputs.username }}
          email: ${{ steps.github-user-info.outputs.email }}

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
          BRANCH: ${{ steps.pull-request.outputs.branch }}
          PR_TITLE: 'chore: delete plan files older than 14 days'
          PR_BODY: |
            Deletes tracked plan files with no Git change during the previous 14 days.

            Generated by the Cleanup Old Plan Files workflow.
        run: |
          set -euo pipefail

          open_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BASE_REF" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if git diff --cached --quiet; then
            if [[ -z "$open_pr" ]]; then
              echo "No staged deletions and no open pull request for ${BRANCH}."
              exit 0
            fi
            git fetch --quiet origin \
              "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" \
              "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            if git diff --quiet "origin/${BASE_REF}...origin/${BRANCH}"; then
              gh pr close "$open_pr" --repo "$GITHUB_REPOSITORY" --delete-branch
            else
              echo "Open pull request #${open_pr} still differs from ${BASE_REF}."
            fi
            exit 0
          fi

          git checkout -B "$BRANCH"
          git commit -m "$PR_TITLE" -- ':(glob).claude/plans/*.md'

          # Update the fixed branch in place. Deleting it first would close the open pull request.
          remote_line=$(git ls-remote --heads origin "refs/heads/${BRANCH}")
          remote_sha=${remote_line%%$'\t'*}
          if [[ -n "$remote_sha" ]]; then
            git push --force-with-lease="refs/heads/${BRANCH}:${remote_sha}" origin "HEAD:refs/heads/${BRANCH}"
          else
            git push --set-upstream origin "HEAD:refs/heads/${BRANCH}"
          fi

          open_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BASE_REF" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$open_pr" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_REF" \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi
