name: Nightly Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from'
        required: false
        default: 'develop'
        type: string
      extensions:
        description: |
          Comma-separated extension names (e.g., "salesforcedx-vscode-apex,salesforcedx-vscode-core")
          Leave empty to publish ALL 16 extensions
        required: false
        default: ''
        type: string
      dry-run:
        description: 'Run in dry-run mode (no actual publishing)'
        required: false
        default: false
        type: boolean
  schedule:
    # Nightly pre-release build at 4 AM UTC - publishes all extensions
    - cron: '0 4 * * *'

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.event.inputs.branch || 'develop' }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-extension-list:
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.list.outputs.extensions }}
    steps:
      - name: Build extension list
        id: list
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_EXTENSIONS: ${{ github.event.inputs.extensions }}
        run: |
          # For scheduled runs or empty input, publish all extensions
          if [ "$EVENT_NAME" = "schedule" ] || [ -z "$INPUT_EXTENSIONS" ]; then
            EXTENSIONS="salesforcedx-vscode-core,salesforcedx-vscode-services,salesforcedx-vscode-apex,salesforcedx-vscode-apex-debugger,salesforcedx-vscode-apex-replay-debugger,salesforcedx-vscode-apex-log,salesforcedx-vscode-apex-oas,salesforcedx-vscode-apex-testing,salesforcedx-vscode-lightning,salesforcedx-vscode-lwc,salesforcedx-vscode-visualforce,salesforcedx-vscode-soql,salesforcedx-vscode-metadata,salesforcedx-vscode-org,salesforcedx-vscode-org-browser,salesforcedx-vscode-expanded"
            echo "Publishing all 16 extensions"
          else
            EXTENSIONS="$INPUT_EXTENSIONS"
            echo "Publishing specified extensions: $EXTENSIONS"
          fi

          echo "extensions=$EXTENSIONS" >> $GITHUB_OUTPUT

  nightly-release:
    needs: build-extension-list
    uses: salesforcecli/github-workflows/.github/workflows/vscode-publish-extensions.yml@ms/shared-ci-actions
    with:
      branch: ${{ github.event.inputs.branch || 'develop' }}
      extensions: ${{ needs.build-extension-list.outputs.extensions }}
      registries: 'all'
      pre-release: 'true'
      version-bump: 'auto'
      dry-run: ${{ github.event.inputs.dry-run || false }}
    secrets: inherit
