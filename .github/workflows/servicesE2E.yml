name: Services E2E (Playwright)

on:
  workflow_dispatch:
    inputs:
      vscode_version:
        description: 'VS Code version for E2E (e.g. 1.119.0). Empty uses repo variable
          PLAYWRIGHT_VSCODE_VERSION.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      vscode_version:
        description: 'VS Code version for E2E (e.g. 1.119.0). Empty uses repo variable
          PLAYWRIGHT_VSCODE_VERSION.'
        required: false
        type: string
        default: ''
  push:
    branches-ignore: [ main, develop ]
    paths-ignore:
      - CONTEXT.md
      - CONTEXT-MAP.md
      - '**/CONTEXT.md'
      - 'docs/**.md'
      - '**/docs/**.md'
      - '.claude/**.md'
      - 'plans/**.md'
      - '.cursor/**.md'

concurrency:
  group: ci-${{ github.ref }}-servicesE2E
  cancel-in-progress: true

jobs:
  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MINIMAL_ORG_ALIAS: minimalTestOrg
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_E2E }}
      PLAYWRIGHT_VSCODE_VERSION: ${{ github.event_name != 'push' &&
        inputs.vscode_version != '' && inputs.vscode_version ||
        vars.PLAYWRIGHT_VSCODE_VERSION }}
    steps:
      - uses: $/.github/actions/playwright-e2e
        with:
          workspace: packages/salesforcedx-vscode-services
          npm-script: test:web
          scratch-orgs: minimal
          sf-cli-version: ${{ vars.SF_CLI_VERSION || 'latest' }}
          report-name: playwright-report-web
          results-name: playwright-test-results-web
