name: Tag and Release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

jobs:
  updating-sha-for-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'main'
          token: ${{ secrets.IDEE_GH_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
      - uses: ./.github/actions/gitConfig
        with:
          email: ${{ secrets.IDEE_GH_EMAIL }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.version }}
          path: ./extensions
      - name: Display downloaded vsix files
        run: ls -R ./extensions
      - uses: salesforcecli/github-workflows/.github/actions/npmInstallWithRetries@main
      - run: npm run vscode:sha256
      - run: scripts/concatenate-sha256.js
      - run: rm ./SHA256
      - run: |
          git add SHA256.md
          git commit -m "chore: updated SHA256 v${{ env.RELEASE_VERSION }} [skip ci]"
      - run: echo "SHA256.md successfully generated and committed."
      - run: git push origin main

  gitTag:
    needs: ['updating-sha-for-release']
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'main'
          token: ${{ secrets.IDEE_GH_TOKEN }}
      - uses: ./.github/actions/gitConfig
        with:
          email: ${{ secrets.IDEE_GH_EMAIL }}
      - run: |
          git tag v${{ env.RELEASE_VERSION }}
          git push origin v${{ env.RELEASE_VERSION }}

  githubRelease:
    needs: ['gitTag']
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'main'
          token: ${{ secrets.IDEE_GH_TOKEN }}
      - uses: ./.github/actions/gitConfig
        with:
          email: ${{ secrets.IDEE_GH_EMAIL }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.version }}
          path: ./extensions
      - name: Display downloaded vsix files
        run: ls -R ./extensions
      - run: gh release create v${{ env.RELEASE_VERSION }} ./extensions/*.vsix --title "Release v${{ env.RELEASE_VERSION }}" --notes-file ./packages/salesforcedx-vscode/CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}

  mergeDevelop:
    needs: [githubRelease]
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    outputs:
      status: ${{ steps.complete.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'main'
          token: ${{ secrets.IDEE_GH_TOKEN }}
      - uses: ./.github/actions/gitConfig
        with:
          email: ${{ secrets.IDEE_GH_EMAIL }}
      - name: 'Merge main to develop and prepend changelog'
        run: |
          git fetch --unshallow
          git checkout develop
          git pull

          # Regular merge
          if ! git merge main --commit --no-edit; then
            echo "::error::Merge conflict occurred. Aborting merge."
            git merge --abort
            exit 1
          fi

          # Prepend package CHANGELOG to root CHANGELOG (idempotent)
          node scripts/prepend-release-changelog.js

          # Commit the changelog update (only if the script made changes)
          if ! git diff --quiet CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "chore: prepend v${{env.RELEASE_VERSION}} to root changelog" \
              -m "Co-Authored-By: GitHub Actions <noreply@github.com>"
          else
            echo "No changelog changes to commit (version already present)"
          fi

          git push origin develop
      - id: complete
        run: |
          echo "status=complete" >> $GITHUB_OUTPUT
      - id: finish
        run: |
          echo "VSCode Tag and Release Success"
