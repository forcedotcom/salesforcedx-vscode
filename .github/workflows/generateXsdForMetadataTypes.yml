name: Generate XSD for Metadata Types

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 0'

jobs:
  generate-xsd:
    name: Generate XSD
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.ref }}

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        uses: salesforcecli/github-workflows/.github/actions/npmInstallWithRetries@main

      - name: Scrape all metadata pages
        run: npm run scrape:all:pages

      - name: Convert JSON to XSD
        run: npm run convert:json:to:xsd

      - name: Validate XSD
        run: npm run validate:xsd
        continue-on-error: true

      - name: Fix XSD errors
        run: npm run fix:xsd:errors

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: metadata_types_map_scraped.json
          path: packages/salesforcedx-vscode-core/metadata_types_map_scraped.json

      - name: Upload XSD artifact
        uses: actions/upload-artifact@v4
        with:
          name: salesforce_metadata_api_common.xsd
          path: packages/salesforcedx-vscode-core/resources/salesforce_metadata_api_common.xsd

      - name: Generate timestamp
        id: timestamp
        run: echo "value=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIMESTAMP: ${{ steps.timestamp.outputs.value }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Create and switch to new branch
          BRANCH="automated/update-xsd-${TIMESTAMP}"
          git checkout -b "$BRANCH"

          # Add changes
          git add packages/salesforcedx-vscode-core/resources/salesforce_metadata_api_common.xsd
          git add packages/salesforcedx-vscode-core/metadata_types_map_scraped.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pr_created=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # If metadata_types_map_scraped.json changed, this is a real metadata update.
          # If only the XSD changed, it's a timestamp-only update with no new content.
          if git diff --staged --name-only | grep -q "metadata_types_map_scraped.json"; then
            echo "has_content_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_content_changes=false" >> $GITHUB_OUTPUT
          fi

          git commit -m "chore: update salesforce_metadata_api_common.xsd and metadata_types_map_scraped.json (${TIMESTAMP})"

          # Push branch
          git push --set-upstream origin "$BRANCH"

          # Create PR and capture URL
          PR_URL=$(gh pr create \
            --title "chore: update Salesforce Metadata API XSD and scraped metadata types (${TIMESTAMP})" \
            --body "This PR updates the \`salesforce_metadata_api_common.xsd\` and \`metadata_types_map_scraped.json\` files with the latest metadata type definitions. Generated by the [Generate XSD for Metadata Types](${RUN_URL}) workflow at ${TIMESTAMP}." \
            --base develop \
            --head "$BRANCH")

          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "pr_created=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Auto-merge or close PR
        if: steps.create-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDEE_GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pr_url }}
          BRANCH: ${{ steps.create-pr.outputs.branch }}
          HAS_CONTENT_CHANGES: ${{ steps.create-pr.outputs.has_content_changes }}
        run: |
          if [ "$HAS_CONTENT_CHANGES" == "true" ]; then
            echo "Real content changes detected in metadata_types_map_scraped.json. Auto-merging PR..."
            # develop requires 1 code-owner review + status checks that never run on this
            # bot branch; svc-idee-bot is repo admin so --admin bypasses both.
            GH_TOKEN="$IDEE_GH_TOKEN" gh pr merge "$PR_URL" --squash --admin --delete-branch
          else
            echo "Only timestamp changes detected in salesforce_metadata_api_common.xsd. Closing PR..."
            gh pr close "$PR_URL" --comment "Closing: only a timestamp change was detected in \`salesforce_metadata_api_common.xsd\` with no real metadata content updates."
            git push origin --delete "$BRANCH" || true
          fi
