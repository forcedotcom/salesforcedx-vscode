name: Code Builder E2E (Playwright)

# Runs the Playwright container specs against the real Code Builder workspace-manager image, with
# the unreleased monorepo VSIX (built by an upstream Build All run, downloaded by runId — the same
# bytes about to ship, not a rebuild) swapped in. Linux-only single job: the code-server runtime is
# identical regardless of host OS, and containers are Linux (plan §10.3).
#
# This workflow DRIVES the repo orchestrator (scripts/codeBuilderLocalE2E.ts, run via
# `npm run test:container:local`) rather than re-implementing the pull → swap → restart → gate →
# specs pipeline — the orchestrator is the local twin of this job, so the two cannot drift (plan
# §9.1 "WF drives ORCH", §15). CI does the ghcr `docker login` (its GITHUB_TOKEN) and dev-hub auth;
# CB_SKIP_GHCR_LOGIN tells the orchestrator to use that ambient docker auth instead of gh/CR_PAT.
#
# Advisory, not blocking (plan §10.4): a red here is a signal to investigate, not an automatic
# release stop. GitHub forbids continue-on-error on a reusable-workflow `uses:` job, so the e2e.yml
# leaf that invokes this CAN'T suppress the failure — a red DOES mark that e2e.yml run failed.
# Advisory-ness therefore lives outside these workflows: the CB check is NON-REQUIRED for
# merge/release branch protection, and a human confirms a real regression before it delays anything.
# Runs on nightly + release flows (via e2e.yml) and on demand (workflow_dispatch); not per-PR yet
# (plan §10.1).

on:
  workflow_dispatch:
    inputs:
      runId:
        description: 'Run ID of the Build All run that produced the VSIX under test.'
        required: true
        type: string
      image_tag:
        description: 'Code Builder image tag to pull (rolling: latest).'
        required: false
        type: string
        default: 'latest'
  workflow_call:
    inputs:
      runId:
        required: true
        type: string
      image_tag:
        required: false
        type: string
        default: 'latest'

concurrency:
  group: ci-${{ github.ref }}-codeBuilderE2E
  # Do NOT cancel in flight: a cancel mid `sf org create scratch` can orphan a half-created org the
  # cleanup step's alias lookup misses. CB e2e is infrequent (nightly/release/dispatch), so queueing
  # overlapping runs is cheaper than leaking scratch orgs.
  cancel-in-progress: false

jobs:
  code-builder-e2e:
    # Sharded per-package (plan §10.3 revisited): one serial container running all ~75 specs blew the
    # 60-min job cap, so each package's suite runs in its own job (own image pull, own scratch org,
    # own container — fully isolated, so parallel jobs can't collide on the shared workbench/org that
    # forced serial execution before). fail-fast: false so one red package doesn't cancel the rest
    # (we want the full pass/fail picture); max-parallel bounds concurrent scratch orgs against the
    # dev hub. Grouping packages into fewer jobs later is a one-line matrix edit — the orchestrator's
    # --only already accepts a comma-separated list.
    name: code-builder-e2e (${{ matrix.package }})
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        package:
          - salesforcedx-vscode-core
          - salesforcedx-vscode-apex
          - salesforcedx-vscode-apex-debugger
          - salesforcedx-vscode-apex-log
          - salesforcedx-vscode-apex-oas
          - salesforcedx-vscode-apex-replay-debugger
          - salesforcedx-vscode-apex-testing
          - salesforcedx-vscode-lightning
          - salesforcedx-vscode-lwc
          - salesforcedx-vscode-metadata
          - salesforcedx-vscode-org
          - salesforcedx-vscode-org-browser
          - salesforcedx-vscode-services
          - salesforcedx-vscode-soql
          - salesforcedx-vscode-visualforce
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      # Pull the private CB image with this repo's GITHUB_TOKEN — the package's Manage Actions
      # access grants salesforcedx-vscode read on workspace-manager/codebuilder.
      packages: read
      # The orchestrator downloads the VSIX artifact + reads run provenance via `gh run download`/
      # `gh run view`, which hit the Actions API. An explicit permissions block zeroes every unlisted
      # scope, so this must be declared or those gh calls 403.
      actions: read
    env:
      CI: '1'
      MINIMAL_ORG_ALIAS: minimalTestOrg
      CONTAINER_NAME: codebuilder-e2e-local
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_E2E }}
      # gh (used by the orchestrator for `gh run download` of the VSIX artifact + provenance) reads
      # this. The job's packages:read + contents:read cover both.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ghcr `docker login` token. Set at job level (not on the login step) because the retry step
      # runs a composite action, and step-level env is not reliably propagated into composite steps.
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # We `docker login` below; tell the orchestrator to rely on that ambient auth, not gh/CR_PAT.
      CB_SKIP_GHCR_LOGIN: '1'
      RUN_ID: ${{ inputs.runId }}
      # Rolling tag by default. A trusted dispatch/call input; kept in env (never inlined into a
      # run: command) to avoid script injection.
      IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
      # The package this shard runs (from the matrix); via env, not inlined, per the same rule.
      PACKAGE: ${{ matrix.package }}
      # Sharded jobs are small (one package), so don't abort at the 3rd failure — run every spec so
      # the report shows the package's true pass/fail count (0 = no Playwright maxFailures cap).
      CB_MAX_FAILURES: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - uses: google/wireit@setup-github-actions-caching/v2

      - name: Install dependencies
        uses: salesforcecli/github-workflows/.github/actions/npmInstallWithRetries@main

      - name: Install Salesforce CLI
        uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          max_attempts: 3
          command: npm i -g @salesforce/cli@${{ vars.SF_CLI_VERSION || 'latest' }}
          retry_wait_seconds: 30

      - name: Install Playwright chromium
        uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          max_attempts: 3
          command: npx playwright install chromium --with-deps
          retry_wait_seconds: 60

      # Pull the private CB image with this repo's built-in GITHUB_TOKEN — the package's Manage
      # Actions access grants salesforcedx-vscode read, so no App/PAT/private key is needed. The
      # orchestrator sees CB_SKIP_GHCR_LOGIN and reuses this login instead of doing its own.
      - name: Log in to ghcr.io
        uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          max_attempts: 3
          # GITHUB_ACTOR is a runner-provided default env var, so it's safe to reference in the
          # command string (no `${{ }}` interpolation → no injection). Retry a transient ghcr hiccup
          # like the other network steps in this job instead of failing the whole run on one blip.
          command: bash -c 'echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin'
          retry_wait_seconds: 30

      - name: Auth to dev hub
        uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          max_attempts: 3
          command: bash -c 'echo "$SFDX_AUTH_URL" | sf org login sfdx-url --set-default-dev-hub --alias hub --sfdx-url-stdin'
          retry_wait_seconds: 30

      # Create the minimal scratch org here (like coreE2E and the other e2e workflows) rather than in
      # the orchestrator: the orchestrator delegates org setup to the toolkit's createMinimalOrg, whose
      # requireOrgInCI intentionally refuses to CREATE in CI and only REUSES a pre-existing org. So the
      # org is created up front under $MINIMAL_ORG_ALIAS and the orchestrator reuses it. (Locally there
      # is no such step; createMinimalOrg creates the org itself since CI is unset.) rm -rf keeps the
      # generate idempotent if the retry wrapper re-runs after a transient failure.
      - name: Create minimal scratch org
        uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          command: bash -c 'rm -rf cb-e2e-org-project && sf project generate -n cb-e2e-org-project && cd cb-e2e-org-project && sf org create scratch -y 1 -d -f config/project-scratch-def.json -a "$MINIMAL_ORG_ALIAS" --json --wait 30'

      # Multi-org specs (org picker/switch) need a SECOND org beyond the boot org. Create a non-tracking
      # scratch org — only for the package(s) that use it (keeps scratch-org spend + time down). The
      # orchestrator auths it into the container via CB_EXTRA_ORG_ALIASES (below). No -d: the boot org
      # ($MINIMAL_ORG_ALIAS) stays the default; multi-org specs switch to this alias with save/restore.
      - name: Create non-tracking scratch org (multi-org specs)
        if: contains(fromJSON('["salesforcedx-vscode-org", "salesforcedx-vscode-metadata", "salesforcedx-vscode-core", "salesforcedx-vscode-apex-testing"]'), matrix.package)
        uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          command: bash -c 'rm -rf cb-e2e-nt-project && sf project generate -n cb-e2e-nt-project && cd cb-e2e-nt-project && sf org create scratch -y 1 -f config/project-scratch-def.json -a nonTrackingTestOrg --no-track-source --json --wait 30'

      # The orchestrator does the rest: download the VSIX for RUN_ID, pull the image, REUSE the scratch
      # org created above (via createMinimalOrg), auth any CB_EXTRA_ORG_ALIASES into the container, run +
      # seed + swap + restart + verify gate, then run the container specs and tear the container down.
      # Same pipeline a developer runs locally. CB_EXTRA_ORG_ALIASES is set only for packages whose specs
      # need extra orgs; empty elsewhere (the orchestrator no-ops).
      - name: Run Code Builder E2E (orchestrator)
        env:
          CB_EXTRA_ORG_ALIASES: ${{ contains(fromJSON('["salesforcedx-vscode-org", "salesforcedx-vscode-metadata", "salesforcedx-vscode-core", "salesforcedx-vscode-apex-testing"]'), matrix.package) && 'nonTrackingTestOrg' || '' }}
        run: npm run test:container:local -- --run-id "$RUN_ID" --image-tag "$IMAGE_TAG" --only "$PACKAGE"

      # This shard runs one package (--only), so only that package's report/results dir exists; the
      # glob matches just it. Name the artifact per-package — upload-artifact@v4 rejects duplicate
      # names across matrix jobs.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-codebuilder-${{ matrix.package }}
          path: packages/*/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-codebuilder-${{ matrix.package }}
          path: packages/*/test-results
          if-no-files-found: ignore

      # The orchestrator tears the container down itself; this is a belt-and-suspenders cleanup for
      # the case where it died before its teardown ran.
      - name: Ensure container removed
        if: always()
        continue-on-error: true
        run: docker rm -f "$CONTAINER_NAME" || true

      # The orchestrator does NOT delete the scratch org (locally it reuses one across runs); a CI
      # runner is ephemeral, so delete it to avoid leaking active scratch orgs against the dev hub.
      - name: Cleanup scratch org
        if: always()
        continue-on-error: true
        run: sf org delete scratch -o "$MINIMAL_ORG_ALIAS" --no-prompt || true

      # Same for the extra multi-org scratch org, when this shard created one.
      - name: Cleanup non-tracking scratch org
        if: always() && contains(fromJSON('["salesforcedx-vscode-org", "salesforcedx-vscode-metadata", "salesforcedx-vscode-core", "salesforcedx-vscode-apex-testing"]'), matrix.package)
        continue-on-error: true
        run: sf org delete scratch -o nonTrackingTestOrg --no-prompt || true
