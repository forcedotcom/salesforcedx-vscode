name: Dependabot Auto-Merge

# Inlined from salesforcecli/github-workflows/.github/workflows/automerge.yml
# That reusable hardcodes `setup-node` with `cache: npm`, which fails on this
# pnpm repo (pnpm-lock.yaml, no package-lock.json) with
# "Dependencies lock file is not found".
# The underlying `sf-release dependabot:automerge` only calls the GitHub API
# (no repo deps), so no cache is needed here.
# This automatically merges dependabot PRs that are:
# 1. Up to date with main/develop
# 2. Mergeable (per GitHub)
# 3. All checks have completed and none failed (skipped may not have run)

on:
  # Manual trigger for testing/debugging
  workflow_dispatch:
    inputs:
      skipCI:
        description: 'Skip CI checks and merge immediately'
        required: false
        default: false
        type: boolean

  # Schedule trigger - runs every hour during off-hours
  schedule:
    - cron: '42 2,5,8,11 * * *'

permissions:
  contents: write # Required to merge PRs
  pull-requests: write # Required to manage PRs
  checks: read # Required to read check statuses
  actions: read # Required to read workflow run information

jobs:
  automerge:
    # Only run for dependabot PRs (when checks complete), manual triggers, or scheduled runs
    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.IDEE_GH_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm install -g @salesforce/plugin-release-management --omit=dev

      - name: run automerge command
        run: sf-release dependabot:automerge --merge-method "squash" --max-version-bump "minor" --owner $GITHUB_REPOSITORY_OWNER --repo $(basename $GITHUB_REPOSITORY) ${{ github.event.inputs.skipCI == 'true' && '--skip-ci' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.IDEE_GH_TOKEN || secrets.GITHUB_TOKEN }}
