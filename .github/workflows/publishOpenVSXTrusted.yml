name: Publish Open VSX (Trusted)
run-name: "Open VSX: ${{ inputs.release-tag || github.event.release.tag_name }}"

# The actual `ovsx publish` for BOTH channels lives here. Open VSX's trusted-publisher match keys
# off the OIDC token's workflow_ref claim -- the top-level workflow that *initiated* the run --
# not job_workflow_ref (the reusable workflow actually executing a job, which can be nested
# arbitrarily deep via `uses:`, even cross-repo, without changing workflow_ref). Open VSX allows
# exactly one trusted-publisher registration per extension (hard server-side check, not a UI gap
# -- see TrustedPublishingService.registerTrustedPublisher in eclipse-openvsx/openvsx), so this is
# the single initiating workflow for both channels: stable triggers it directly via its own
# `release` event, and promote-to-prerelease.yml dispatches it via `gh workflow run` (a brand-new
# independent run, not a `uses:` call) for the nightly being promoted. Register the Open VSX
# trusted publisher against *this* file.
#
# CTC (Change Traffic Control / release moratorium check) lives here too, not in a separate
# workflow, because it has to actually gate `publish` via `needs:` -- a separate top-level
# workflow triggered by the same `release` event would run concurrently with no ordering
# guarantee, so a moratorium wouldn't block anything. Stable is the only CTC-gated channel: the
# `release` event always means stable, and every stable workflow_dispatch (retry/hotfix) must
# pass `do-ctc: true` explicitly. Nothing infers this from the release tag -- an emergency
# prerelease (built via build-github-release.yml's emergencyPrerelease mode) and a stable hotfix
# retry can both be plain `vX.Y.Z` tags dispatched with `isHotfix: true`; tag shape can't tell
# them apart, only the caller knows which channel it's publishing. promote-to-prerelease.yml,
# the only prerelease caller, leaves do-ctc at its default (false).
#
# Deliberately has no `environment: publish` (unlike the stable `prepare-release-metadata` this
# replaced): that environment has a required-reviewers protection rule, which would turn every
# automated weekly prerelease dispatch into one requiring manual approval.

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release tag to publish (stable, e.g. v67.10.0, or nightly, e.g. v67.13.7-nightly.develop.20260820)'
        required: true
        type: string
      dry-run:
        description: 'Download and inspect VSIXs without publishing'
        type: boolean
        default: false
      isHotfix:
        description: 'Test the exact release commit directly before publishing. Use for stable hotfixes built via build-github-release.yml startFromRef, which have no other automated test gate for this registry. Prerelease dispatches never need this -- promote-to-prerelease.yml already tested the commit before dispatching here.'
        required: false
        default: false
        type: boolean
      do-ctc:
        description: 'Open and close a CTC change case around this publish. Set true for every stable dispatch (retry/hotfix) -- the release-tag shape alone cannot distinguish a stable hotfix from an emergency prerelease, so this is never inferred. Leave false for prerelease.'
        required: false
        default: false
        type: boolean

jobs:
  # Excludes npm-package tags (soql-common-v1.0.4 etc.) and nightly tags (defensively, in case one
  # somehow got flipped to `released`) from the automatic `release` trigger. workflow_dispatch is
  # unaffected -- that's the path promote-to-prerelease.yml uses to publish an actual nightly tag
  # on purpose.
  prepare:
    if: github.event_name != 'release' || (!contains(github.event.release.tag_name, '-v') && !contains(github.event.release.tag_name, '-nightly'))
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.tag.outputs.tag }}
      release-version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.event.release.tag_name }}
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  # Only exercised on a manual isHotfix dispatch retry. The prerelease dispatch from
  # promote-to-prerelease.yml never sets isHotfix -- that workflow's own gate-check already tested
  # the commit before it ever got here.
  gate-check:
    needs: [prepare]
    if: inputs.isHotfix == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history to check out the release tag below

      - name: Checkout hotfix commit
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
        run: git checkout "$RELEASE_TAG"

      - name: Setup Node.js
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
          install: 'false'

      - name: Install dependencies for hotfix commit
        uses: salesforcecli/github-workflows/.github/actions/pnpmInstallWithRetries@main
      - name: Run tests for hotfix commit
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          WIREIT_PARALLEL: 1
        run: |
          pnpm compile
          pnpm test

  # Runs for every real stable release (the automatic `release` event) and any stable
  # workflow_dispatch that explicitly opts in via `do-ctc: true`. Dispatching a change case for
  # every weekly prerelease would be noise, not signal, so prerelease callers leave do-ctc at its
  # default false -- see the header comment for why this can't be inferred from the tag instead.
  ctc-open:
    needs: [prepare]
    if: always() && needs.prepare.result == 'success' && (github.event_name == 'release' || inputs.do-ctc == true) && inputs.dry-run != true
    uses: salesforcecli/github-workflows/.github/workflows/ctcOpen.yml@main
    secrets: inherit

  publish:
    needs: [prepare, gate-check, ctc-open]
    if: always() && needs.prepare.result == 'success' && (needs.gate-check.result == 'success' || needs.gate-check.result == 'skipped') && (needs.ctc-open.result == 'success' || needs.ctc-open.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    uses: salesforcecli/github-workflows/.github/workflows/openvsx-publish-release-vsix.yml@main
    with:
      release-tag: ${{ needs.prepare.outputs.release-tag }}
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit

  # Confirms the version actually landed on Open VSX before closing the change case. Skipped
  # alongside ctc-open when this isn't a CTC-gated run -- see that job's comment.
  verify-published:
    needs: [prepare, ctc-open, publish]
    if: always() && needs.publish.result == 'success' && (github.event_name == 'release' || inputs.do-ctc == true) && inputs.dry-run != true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout, so give the gh CLI its repo context for `gh release download`.
      GH_REPO: ${{ github.repository }}
      PUBLISH_VERSION: ${{ needs.prepare.outputs.release-version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release-tag }}
    steps:
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
      - name: Download VSIXs from release
        run: |
          mkdir ./extensions
          gh release download "$RELEASE_TAG" -D ./extensions
      - name: Verify published versions landed on OpenVSX
        run: |
          TIMEOUT="${POLL_TIMEOUT:-1200}"
          INTERVAL="${POLL_INTERVAL:-30}"
          deadline=$(( $(date +%s) + TIMEOUT ))
          pending=()
          while IFS= read -r -d '' f; do
            pending+=("salesforce.$(basename "$f" "-$PUBLISH_VERSION.vsix")")
          done < <(find ./extensions -type f -name '*.vsix' -print0)
          if [ "${#pending[@]}" -eq 0 ]; then
            echo "::error::No VSIX files found in release $RELEASE_TAG"
            exit 1
          fi
          while :; do
            still=()
            for id in "${pending[@]}"; do
              if pnpm dlx ovsx@0.10.12 get "$id" --metadata -v "$PUBLISH_VERSION" >/dev/null 2>&1; then
                echo "confirmed $id@$PUBLISH_VERSION"
              else
                still+=("$id")
              fi
            done
            pending=("${still[@]}")
            [ "${#pending[@]}" -eq 0 ] && break
            [ "$(date +%s)" -ge "$deadline" ] && break
            sleep "$INTERVAL"
          done
          if [ "${#pending[@]}" -gt 0 ]; then
            for id in "${pending[@]}"; do
              echo "::error::$id@$PUBLISH_VERSION never landed on OpenVSX"
            done
            exit 1
          fi
          echo "All published versions landed on OpenVSX"

  ctcCloseSuccess:
    needs: [ctc-open, verify-published]
    if: needs.ctc-open.result == 'success' && needs.verify-published.result == 'success' && needs.ctc-open.outputs.changeCaseId
    uses: salesforcecli/github-workflows/.github/workflows/ctcClose.yml@main
    secrets: inherit
    with:
      changeCaseId: ${{ needs.ctc-open.outputs.changeCaseId }}

  ctcCloseFail:
    needs: [ctc-open, verify-published]
    if: always() && needs.ctc-open.result == 'success' && needs.ctc-open.outputs.changeCaseId && needs.verify-published.result != 'success'
    uses: salesforcecli/github-workflows/.github/workflows/ctcClose.yml@main
    secrets: inherit
    with:
      changeCaseId: ${{ needs.ctc-open.outputs.changeCaseId }}
      status: Not Implemented
