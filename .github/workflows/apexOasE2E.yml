name: Apex OAS E2E (Playwright)

on:
  workflow_dispatch:
    inputs:
      vscode_version:
        description: 'VS Code version for E2E (e.g. 1.116.0). Empty uses repo variable
          PLAYWRIGHT_VSCODE_VERSION.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      vscode_version:
        description: 'VS Code version for E2E (e.g. 1.116.0). Empty uses repo variable
          PLAYWRIGHT_VSCODE_VERSION.'
        required: false
        type: string
        default: ''
  push:
    branches-ignore: [ main, develop ]
    paths-ignore:
      - CONTEXT.md
      - CONTEXT-MAP.md
      - '**/CONTEXT.md'
      - 'docs/**.md'
      - '**/docs/**.md'
      - '.claude/**.md'
      - 'plans/**.md'
      - '.cursor/**.md'

concurrency:
  group: ci-${{ github.ref }}-apexOasE2E
  cancel-in-progress: true

jobs:
  e2e-desktop:
    # Generation specs remain blocked by A4V v4 (W-22997620); this smoke test needs no LLM or org.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest ]
      fail-fast: false

    env:
      VSCODE_DESKTOP: 1
      E2E_FROM_VSIX: 1
      PLAYWRIGHT_VSCODE_VERSION: ${{ github.event_name != 'push' &&
        inputs.vscode_version != '' && inputs.vscode_version ||
        vars.PLAYWRIGHT_VSCODE_VERSION }}
    steps:
      - uses: $/.github/actions/playwright-e2e
        with:
          workspace: packages/salesforcedx-vscode-apex-oas
          npm-script: test:desktop:smoke
          sf-cli-version: ${{ vars.SF_CLI_VERSION || 'latest' }}
          report-name: playwright-report-apex-oas-desktop-${{ matrix.os }}
          results-name: playwright-test-results-apex-oas-desktop-${{ matrix.os }}
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
