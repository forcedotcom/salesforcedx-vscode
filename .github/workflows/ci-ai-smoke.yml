name: CI AI smoke
on:
  pull_request:
    paths:
      - 'scripts/changelogBody/**'
      - 'scripts/manualTestPlan/**'
      - 'scripts/categoryApprove.mts'
      - 'scripts/shared/openCode.mts'
      - 'scripts/shared/category*.mts'
      - 'scripts/shared/jevDecisions.mts'
      - 'test/jev-decisions.test.mts'
      - 'test/ci-ai*.mts'
      - 'test/ciAiFixtures.mts'
      - '.opencode/skills/changelog-judgment/**'
      - '.opencode/skills/manual-test-plan-judgment/**'
      - '.github/actions/setup-opencode/**'
      - '.github/workflows/changelog-body.yml'
      - '.github/workflows/manual-test-plan.yml'
      - '.github/workflows/categoryApprove.yml'
      - '.github/workflows/ci-ai-smoke.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24
      - uses: ./.github/actions/setup-opencode
      - run: pnpm --filter @salesforce/effect-octokit compile
      - run: pnpm --filter @salesforce/opencode-decisions compile
      - run: pnpm test:ci-ai
      - run: pnpm test:ai-safeguards
      - run: pnpm test:manual-test-plan
      - run: node --test test/ci-ai-smoke.test.mts
      - name: Verify live Jev classification (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          export OPENCODE_CONFIG_CONTENT='{"providers":{"opencode":{"settings":{"apiKey":"{env:OPENCODE_API_KEY}"}}}}'
          mkdir -p "$RUNNER_TEMP/jev-opencode"
          (cd "$RUNNER_TEMP/jev-opencode" && opencode --standalone serve --hostname 127.0.0.1 --port 4096) > "$RUNNER_TEMP/jev-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node --input-type=module -e 'for (let i = 0; i < 60; i++) { try { const r = await fetch("http://127.0.0.1:4096/api/info"); if (r.ok) process.exit(0); } catch {} await new Promise(resolve => setTimeout(resolve, 1000)); } process.exit(1);'
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { Effect, Option } from "effect";
            import { classifyWithJev } from "./scripts/shared/categoryJev.mts";
            const diff = "diff --git a/test/example.test.ts b/test/example.test.ts\n--- a/test/example.test.ts\n+++ b/test/example.test.ts\n@@ -1 +1,2 @@\n assert.ok(true);\n+assert.equal(1, 1);\n";
            const result = await classifyWithJev({ policy: readFileSync("APPROVAL_POLICY.md", "utf8"), diff, hasCoveredHunks: false }).pipe(Effect.runPromise);
            if (Option.isNone(result) || !result.value.includes("tests-only")) throw new Error("Jev did not classify the test addition");
          '
