name: Unit Tests Windows
on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: false
env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  windows-unit-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
          install: 'false'
      - uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2
      - uses: salesforcecli/github-workflows/.github/actions/pnpmInstallWithRetries@b974ac8caddfccebd27cb28c0f88c1991dcca4c1 # main
      - run: pnpm compile
      - run: pnpm test
        env:
          # Concurrent Wireit test tasks make Windows CI slower and more failure-prone.
          WIREIT_PARALLEL: 1
