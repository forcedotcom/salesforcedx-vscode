name: Visualforce E2E (Playwright)

on:
  workflow_dispatch:
    inputs:
      vscode_version:
        description: 'VS Code version for E2E (e.g. 1.116.0). Empty uses repo variable
          PLAYWRIGHT_VSCODE_VERSION.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      vscode_version:
        description: 'VS Code version for E2E (e.g. 1.116.0). Empty uses repo variable
          PLAYWRIGHT_VSCODE_VERSION.'
        required: false
        type: string
        default: ''
  push:
    branches-ignore: [ main, develop ]
    paths-ignore:
      - CONTEXT.md
      - CONTEXT-MAP.md
      - '**/CONTEXT.md'
      - 'docs/**.md'
      - '**/docs/**.md'
      - '.claude/**.md'
      - 'plans/**.md'
      - '.cursor/**.md'

concurrency:
  group: ci-${{ github.ref }}-visualforceE2E
  cancel-in-progress: true

jobs:
  # ─── Web (headless specs only — desktop.spec.ts excluded by playwright.config.web.ts) ───

  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_VSCODE_VERSION: ${{ github.event_name != 'push' &&
        inputs.vscode_version != '' && inputs.vscode_version ||
        vars.PLAYWRIGHT_VSCODE_VERSION }}
    steps:
      - uses: $/.github/actions/playwright-e2e
        with:
          workspace: packages/salesforcedx-vscode-visualforce
          npm-script: test:web
          report-name: playwright-report-visualforce-web
          results-name: playwright-test-results-visualforce-web
  e2e-desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VSCODE_DESKTOP: 1
      E2E_FROM_VSIX: 1
      PLAYWRIGHT_VSCODE_VERSION: ${{ github.event_name != 'push' &&
        inputs.vscode_version != '' && inputs.vscode_version ||
        vars.PLAYWRIGHT_VSCODE_VERSION }}
    strategy:
      matrix:
        os: [ macos-latest, windows-latest ]
      fail-fast: false

    steps:
      - uses: $/.github/actions/playwright-e2e
        with:
          workspace: packages/salesforcedx-vscode-visualforce
          npm-script: test:desktop
          report-name: playwright-report-visualforce-desktop-${{ matrix.os }}
          results-name: playwright-test-results-visualforce-desktop-${{ matrix.os }}
