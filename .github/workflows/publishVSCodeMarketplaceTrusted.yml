name: Publish VS Code Marketplace (Trusted) [TEST]
run-name: "VS Code Marketplace OIDC test: ${{ inputs.release-tag }}"

# Dispatch-only, registration/test workflow for VS Code Marketplace OIDC trusted publishing
# (vsce --oidc, shipped by Microsoft 2026-10-28). Exists purely so this file is registered on
# develop and can be dispatched by filename -- GitHub won't run a workflow_dispatch workflow by
# name until it exists on the repo's default branch, even when the intent is to run a different
# branch's content via `--ref`.
#
# TEMPORARY variant: the nested-call version of this file (dispatching
# salesforcecli/github-workflows's vscode-publish-release-vsix.yml) got a 401 Unauthorized from
# every extension/repo it was tried against, even with a Trusted Publishing policy registered
# and active for this repo + this workflow filename. This version inlines the publish step
# directly in this workflow (no cross-repo `uses:` in between) to test whether the Marketplace's
# trust check keys off job_workflow_ref (which would differ for a nested reusable workflow in
# another repo) rather than workflow_ref (which Open VSX is confirmed to use, and which stays the
# same whether nested or not). See W-24756661.
#
# Not wired into any real release channel yet -- that depends on what this test finds.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release tag to publish (stable, e.g. v67.10.0, or nightly, e.g. v67.13.7-nightly.develop.20260820)'
        required: true
        type: string
      dry-run:
        description: 'Download and inspect VSIXs without publishing'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download one release VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          mkdir extensions
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'salesforcedx-vscode-visualforce-*.vsix' --dir extensions
          find extensions -type f -name '*.vsix'

      - name: Publish VSIX
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          vsix=$(find extensions -type f -name '*.vsix' -print -quit)
          if [ "$DRY_RUN" = true ]; then
            echo "Would publish $vsix to the VS Code Marketplace: @vscode/vsce publish --packagePath $vsix --oidc --skip-duplicate"
            exit 0
          fi
          npx @vscode/vsce publish --packagePath "$vsix" --oidc --skip-duplicate
