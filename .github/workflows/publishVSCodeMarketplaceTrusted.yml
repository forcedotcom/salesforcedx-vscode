name: Publish VS Code Marketplace (Trusted) [TEST]
run-name: "VS Code Marketplace OIDC test: ${{ inputs.release-tag }}"

# Dispatch-only, registration/test workflow for VS Code Marketplace OIDC trusted publishing
# (vsce --oidc, shipped by Microsoft 2026-10-28). Exists purely so this file is registered on
# develop and can be dispatched by filename -- GitHub won't run a workflow_dispatch workflow by
# name until it exists on the repo's default branch, even when the intent is to run a different
# branch's content via `--ref`.
#
# TEMPORARY variant: the nested-call version of this file (dispatching
# salesforcecli/github-workflows's vscode-publish-release-vsix.yml) got a 401 Unauthorized from
# every extension/repo it was tried against, even with a Trusted Publishing policy registered
# and active for this repo + this workflow filename. This version inlines the publish step
# directly in this workflow (no cross-repo `uses:` in between) to test whether the Marketplace's
# trust check keys off job_workflow_ref (which would differ for a nested reusable workflow in
# another repo) rather than workflow_ref (which Open VSX is confirmed to use, and which stays the
# same whether nested or not). See W-24756661.
#
# A single-VSIX smoke test with this shape already succeeded -- this version inlines the full
# download+publish+retry logic (matching vscode-publish-release-vsix.yml@main's shape) so the
# real multi-VSIX release path can be validated end-to-end before it's wired into publishVSCode.yml.
#
# Not wired into any real release channel yet -- that depends on what this test finds.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release tag to publish (stable, e.g. v67.10.0, or nightly, e.g. v67.13.7-nightly.develop.20260820)'
        required: true
        type: string
      dry-run:
        description: 'Download and inspect VSIXs without publishing'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release VSIXs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          mkdir extensions
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --dir extensions

          if ! find extensions -type f -name '*.vsix' -print -quit | grep -q .; then
            echo "No VSIX files found in release $RELEASE_TAG"
            exit 1
          fi

          echo 'Downloaded VSIX files:'
          find extensions -type f -name '*.vsix'

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease | grep -qx true; then
            echo 'pre-release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pre-release=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish VSIXs
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          PRE_RELEASE: ${{ steps.release.outputs.pre-release }}
        run: |
          # Marketplace gallery requests can sit until typed-rest-client's 180s
          # socket timeout. vsce has no timeout flag; retry per VSIX.
          # --skip-duplicate makes a retry a no-op if the first attempt committed.
          publish_with_retry() {
            local attempt
            for attempt in 1 2 3; do
              echo "Publish attempt ${attempt}/3"
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Publish failed; retrying in 15s..."
                sleep 15
              fi
            done
            return 1
          }

          while IFS= read -r -d '' vsix; do
            args=(--packagePath "$vsix" --oidc --skip-duplicate)
            if [ "$PRE_RELEASE" = true ]; then
              args+=(--pre-release)
            fi

            if [ "$DRY_RUN" = true ]; then
              echo "Would publish $vsix to the VS Code Marketplace with --skip-duplicate: @vscode/vsce publish ${args[*]}"
              continue
            fi

            if ! publish_with_retry npx @vscode/vsce publish "${args[@]}"; then
              echo "::error::Failed to publish $vsix after 3 attempts"
              exit 1
            fi
          done < <(find extensions -type f -name '*.vsix' -print0)
