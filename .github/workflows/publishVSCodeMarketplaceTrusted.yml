name: Publish VS Code Marketplace (Trusted) [TEST]
run-name: "VS Code Marketplace OIDC test: ${{ inputs.release-tag }}"

# Dispatch-only, registration/test workflow for VS Code Marketplace OIDC trusted publishing
# (vsce --oidc, shipped by Microsoft 2026-10-28). Exists purely so this file is registered on
# develop and can be dispatched by filename -- GitHub won't run a workflow_dispatch workflow by
# name until it exists on the repo's default branch, even when the intent is to run a different
# branch's content via `--ref`.
#
# TEMPORARY variant: the nested-call version of this file (dispatching
# salesforcecli/github-workflows's vscode-publish-release-vsix.yml) got a 401 Unauthorized from
# every extension/repo it was tried against, even with a Trusted Publishing policy registered
# and active for this repo + this workflow filename. The Marketplace's OIDC trust check keys off
# job_workflow_ref, which for a nested reusable workflow always points at the other repo rather
# than this one (unlike workflow_ref, which Open VSX is confirmed to use, and which stays the same
# whether nested or not). See W-24756661.
#
# A single-VSIX smoke test inlining the publish step directly in this workflow (no cross-repo
# `uses:` in between) succeeded, then so did the full multi-VSIX download+publish+retry version.
# That logic has since been extracted to a reusable composite action (which runs as a step inside
# this job rather than as a separate job, so job_workflow_ref still matches) --
# salesforcecli/github-workflows#207. This version calls that action, pinned to its PR branch
# until #207 merges, to validate the extracted shape end-to-end before it's wired into
# publishVSCode.yml.
#
# Not wired into any real release channel yet -- that depends on what this test finds.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release tag to publish (stable, e.g. v67.10.0, or nightly, e.g. v67.13.7-nightly.develop.20260820)'
        required: true
        type: string
      dry-run:
        description: 'Download and inspect VSIXs without publishing'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # TEMPORARY: pinned to the github-workflows PR branch adding this action
      # (salesforcecli/github-workflows#207), to validate end-to-end before that PR merges.
      - uses: salesforcecli/github-workflows/.github/actions/vscode/publish-release-vsix@ms/W-24756661-vsce-oidc-composite-action
        with:
          release-tag: ${{ inputs.release-tag }}
          dry-run: ${{ inputs.dry-run || false }}
