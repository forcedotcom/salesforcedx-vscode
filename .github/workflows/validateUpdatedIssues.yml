name: 'Validate Updated Issues'
on:
  issues:
    types: [edited, labeled]
  issue_comment:
    types: [created, edited]

jobs:
  route-issue-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
          install: 'false'
      - name: Install dependencies
        uses: salesforcecli/github-workflows/.github/actions/pnpmInstallWithRetries@main
      - name: Compile effect-octokit
        run: pnpm --filter @salesforce/effect-octokit compile
      - name: Route issue update
        uses: ./.github/actions/validate-issue
        with:
          repo-token: ${{ secrets.IDEE_GH_TOKEN }}
