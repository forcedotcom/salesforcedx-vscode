name: LWC E2E (Playwright)

on:
  workflow_dispatch:
    inputs:
      vscode_version:
        description: 'VS Code version for desktop Playwright E2E (e.g. 1.116.0). Leave
          empty to use repo variable PLAYWRIGHT_VSCODE_VERSION.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      vscode_version:
        description: 'VS Code version for desktop Playwright E2E (e.g. 1.116.0). Leave
          empty to use repo variable PLAYWRIGHT_VSCODE_VERSION.'
        required: false
        type: string
        default: ''
  push:
    branches-ignore: [main, develop]
    paths-ignore:
      - CONTEXT.md
      - CONTEXT-MAP.md
      - '**/CONTEXT.md'
      - 'docs/**.md'
      - '**/docs/**.md'
      - '.claude/**.md'
      - 'plans/**.md'
      - '.cursor/**.md'

concurrency:
  group: ci-${{ github.ref }}-lwcPlaywrightE2E
  cancel-in-progress: true

jobs:
  # ─── Web (headless specs only — desktop.spec.ts excluded by playwright.config.web.ts) ───

  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_VSCODE_VERSION: ${{ github.event_name != 'push' && inputs.vscode_version != '' && inputs.vscode_version || vars.PLAYWRIGHT_VSCODE_VERSION }}
    steps:
      - uses: $/.github/actions/playwright-e2e
        with:
          workspace: packages/salesforcedx-vscode-lwc
          npm-script: test:web
          report-name: playwright-report-lwc-web
          results-name: playwright-test-results-lwc-web
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
  e2e-desktop-lsp:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false
    env:
      VSCODE_DESKTOP: 1
      E2E_FROM_VSIX: 1
      PLAYWRIGHT_VSCODE_VERSION: ${{ github.event_name != 'push' && inputs.vscode_version != '' && inputs.vscode_version || vars.PLAYWRIGHT_VSCODE_VERSION }}
    steps:
      - uses: $/.github/actions/playwright-e2e
        with:
          workspace: packages/salesforcedx-vscode-lwc
          npm-script: test:desktop
          spec-filter: headless
          report-name: playwright-report-lwc-desktop-lsp-${{ matrix.os }}
          results-name: playwright-test-results-lwc-desktop-lsp-${{ matrix.os }}
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
  e2e-desktop-run-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false
    env:
      VSCODE_DESKTOP: 1
      E2E_FROM_VSIX: 1
      PLAYWRIGHT_VSCODE_VERSION: ${{ github.event_name != 'push' && inputs.vscode_version != '' && inputs.vscode_version || vars.PLAYWRIGHT_VSCODE_VERSION }}
    steps:
      - uses: $/.github/actions/playwright-e2e
        with:
          workspace: packages/salesforcedx-vscode-lwc
          npm-script: test:desktop
          spec-filter: lwcRunTests
          report-name: playwright-report-lwc-desktop-run-tests-${{ matrix.os }}
          results-name: playwright-test-results-lwc-desktop-run-tests-${{ matrix.os }}
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
  e2e-desktop-debug-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
      fail-fast: false
    env:
      VSCODE_DESKTOP: 1
      E2E_FROM_VSIX: 1
      PLAYWRIGHT_VSCODE_VERSION: ${{ github.event_name != 'push' && inputs.vscode_version != '' && inputs.vscode_version || vars.PLAYWRIGHT_VSCODE_VERSION }}
    steps:
      - uses: $/.github/actions/playwright-e2e
        with:
          workspace: packages/salesforcedx-vscode-lwc
          npm-script: test:desktop
          spec-filter: lwcDebugTests
          report-name: playwright-report-lwc-desktop-debug-tests-${{ matrix.os }}
          results-name: playwright-test-results-lwc-desktop-debug-tests-${{ matrix.os }}
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
