name: Doc-Only Auto-Merge

# Squash-merges PRs that touch ONLY doc-glossary files to develop, no human review.
# Doc-only globs: CONTEXT.md, CONTEXT-MAP.md, **/CONTEXT.md, docs/**/*.md,
# **/docs/**/*.md, .claude/**/*.md (markdown only — NOT .claude/**/*.js).
# Restricted to forcedotcom/ide-foundations members. Merges via svc-idee-bot
# (IDEE_GH_TOKEN, repo admin) — --admin bypasses branch protection, which is
# required because the doc-only paths-ignore means the normal required checks
# (pr-validation, build-and-test, code-quality) never post on a doc-only PR.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]

# Same-repo branch (team members push to origin, not forks) → org secrets available.
# NOT pull_request_target — avoids running untrusted head with secrets.

permissions:
  contents: write # merge the PR
  pull-requests: write # read PR metadata, merge
  checks: read # read status rollup

concurrency:
  # Serialize per-PR so rapid synchronize events can't double-merge.
  group: doc-only-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Gate — doc-only file set
        id: doconly
        run: |
          set -euo pipefail
          # Paginate the full file list; --json files (gh pr view) caps at 100 and
          # would false-"doc-only" a truncated large PR.
          files=$(gh api --paginate "repos/${REPO}/pulls/${PR}/files" -q '.[].filename')
          if [ -z "$files" ]; then
            echo "no files in PR — skip"; echo "match=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed files:"; echo "$files"
          # Allowlist (markdown only where noted):
          #  (^|/)CONTEXT\.md$   root + any package CONTEXT.md
          #  ^CONTEXT-MAP\.md$   root only
          #  (^|/)docs/.*\.md$   root docs/ + packages/*/docs/, .md only
          #  ^\.claude/.*\.md$   .claude markdown only (NOT .js workflows)
          allow='(^|/)CONTEXT\.md$|^CONTEXT-MAP\.md$|(^|/)docs/.*\.md$|^\.claude/.*\.md$'
          nondoc=$(echo "$files" | grep -Ev "$allow" || true)
          if [ -n "$nondoc" ]; then
            echo "non-doc files present — not eligible:"; echo "$nondoc"
            echo "match=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "match=true" >>"$GITHUB_OUTPUT"

      - name: Gate — author in ide-foundations
        id: author
        if: steps.doconly.outputs.match == 'true'
        run: |
          set -euo pipefail
          state=$(gh api "orgs/forcedotcom/teams/ide-foundations/memberships/${AUTHOR}" -q '.state' 2>/dev/null || true)
          if [ "$state" != "active" ]; then
            echo "author ${AUTHOR} not an active ide-foundations member (state='${state}') — skip"
            echo "ok=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >>"$GITHUB_OUTPUT"

      - name: Gate — not CHANGES_REQUESTED and mergeable
        id: prstate
        if: steps.author.outputs.ok == 'true'
        run: |
          set -euo pipefail
          decision=$(gh pr view "$PR" --repo "$REPO" --json reviewDecision -q '.reviewDecision')
          if [ "$decision" = "CHANGES_REQUESTED" ]; then
            echo "review is CHANGES_REQUESTED — never override — skip"
            echo "ok=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          # mergeable can be UNKNOWN briefly after open; poll a few times.
          mergeable=UNKNOWN
          for _ in $(seq 1 6); do
            mergeable=$(gh pr view "$PR" --repo "$REPO" --json mergeable -q '.mergeable')
            [ "$mergeable" != "UNKNOWN" ] && break
            sleep 5
          done
          if [ "$mergeable" != "MERGEABLE" ]; then
            echo "PR not mergeable (state='${mergeable}') — skip"
            echo "ok=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >>"$GITHUB_OUTPUT"

      - name: Gate — security scans present and settled
        id: checks
        if: steps.prstate.outputs.ok == 'true'
        env:
          # Own run id — this job's check run is in the rollup and is in_progress for as
          # long as it polls, so counting it as "running" would never settle (deadlock).
          SELF_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Required-check workflows are paths-ignore'd on doc-only PRs → their
          # contexts never post. Only org SAST + Credential Scanning run. Guard the
          # empty-rollup race (poll passes before scans queue): require BOTH scan
          # rows present before treating "no running rows" as settled.
          expected='["SAST","Credential Scanning Analysis"]'
          for _ in $(seq 1 20); do # ~5 min @ 15s; scans normally post within ~1 min
            # statusCheckRollup is null right after PR-open (no checks registered yet);
            # normalize to [] inside jq so it doesn't crash — empty → not-present → keep polling.
            rollup=$(gh pr view "$PR" --repo "$REPO" --json statusCheckRollup -q '.statusCheckRollup')
            read -r failure present running < <(echo "$rollup" | jq -r --argjson exp "$expected" --arg self "$SELF_RUN" '
              # Drop this run own rows by detailsUrl (.../actions/runs/<id>/job/<id>).
              # StatusContext rows have no detailsUrl → "" → kept.
              [ (. // [])[] | select(((.detailsUrl // "") | contains("/actions/runs/" + $self + "/")) | not) ] as $rows
              | def outcome: (.conclusion // .state // "PENDING") | ascii_upcase;
              def name: (.name // .context // "");
              def isRunning:
                ((.status // "") | ascii_upcase) as $s
                | ($s == "IN_PROGRESS" or $s == "QUEUED" or $s == "PENDING" or $s == "WAITING" or $s == "REQUESTED")
                  or (outcome == "PENDING" or outcome == "EXPECTED");
              (any($rows[]; outcome as $o | ($o == "FAILURE" or $o == "CANCELLED" or $o == "TIMED_OUT" or $o == "ERROR" or $o == "ACTION_REQUIRED" or $o == "STARTUP_FAILURE"))) as $f
              | ([$rows[] | name]) as $names
              | (all($exp[]; . as $e | $names | index($e) != null)) as $p
              | (any($rows[]; isRunning)) as $r
              | "\($f) \($p) \($r)"')
            echo "poll: failure=$failure present=$present running=$running"
            if [ "$failure" = "true" ]; then
              echo "a security scan failed — never merge — abort"; exit 1
            fi
            if [ "$present" = "true" ] && [ "$running" = "false" ]; then
              echo "scans present and settled"; echo "ok=true" >>"$GITHUB_OUTPUT"; exit 0
            fi
            sleep 15
          done
          # A scan that never posts (AST service miss) is not a security signal — leave the
          # PR for a human to merge instead of a permanently red check on a doc-only PR.
          echo "scans never settled within the window — no auto-merge, merge manually"
          echo "ok=false" >>"$GITHUB_OUTPUT"

      - name: Squash-merge (admin bypass)
        if: steps.checks.outputs.ok == 'true'
        env:
          # The head SHA this run validated. --match-head-commit refuses the merge if a
          # new commit landed after the gates ran (TOCTOU: gate a doc-only head, then a
          # code commit is pushed before merge).
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "auto-merging doc-only PR #${PR} by ${AUTHOR} at ${HEAD_SHA}"
          gh pr merge "$PR" --repo "$REPO" --squash --admin --match-head-commit "$HEAD_SHA"
