name: Manual test plan

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: manual-test-plan-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  secret:
    name: OpenCode API key
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - name: Check OPENCODE_API_KEY
        id: check
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          if [ -n "$OPENCODE_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

  body:
    name: Manual test plan
    needs: secret
    if: github.event_name == 'pull_request' && needs.secret.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24
      - name: Compile effect-octokit
        run: pnpm --filter @salesforce/effect-octokit compile
      - name: Install OpenCode CLI
        run: npm install --global @opencode/cli@2.3.0
      - name: Write manual test plan
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODELS: ${{ vars.OPENCODE_MODELS }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/manualTestPlan/manualTestPlan.mts

  smoke:
    name: OpenCode smoke (${{ matrix.model }})
    needs: secret
    if: github.event_name == 'workflow_dispatch' && needs.secret.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(vars.OPENCODE_MODELS) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24
      - name: Install OpenCode CLI
        run: npm install --global @opencode/cli@2.3.0
      - name: Verify authenticated inference and repository reads
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODELS: ${{ format('["{0}"]', matrix.model) }}
        run: node scripts/manualTestPlan/smoke.mts
