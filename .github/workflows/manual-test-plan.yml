name: Manual test plan

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: manual-test-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  secret:
    name: Cursor API key
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - name: Check IDEE_CURSOR_API_KEY
        id: check
        env:
          IDEE_CURSOR_API_KEY: ${{ secrets.IDEE_CURSOR_API_KEY }}
        run: |
          if [ -n "$IDEE_CURSOR_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

  body:
    name: Manual test plan
    needs: secret
    if: needs.secret.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24
      - name: Compile effect-octokit
        run: pnpm --filter @salesforce/effect-octokit compile
      - name: Write manual test plan
        env:
          CURSOR_API_KEY: ${{ secrets.IDEE_CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/manualTestPlan/manualTestPlan.mts
