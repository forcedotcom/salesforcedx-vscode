name: Validate PR
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: [develop]
    paths-ignore:
      - '.claude/**'
      - '.cursor/**'
      - 'contributing/**'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'CONTEXT.md'
      - 'CONTEXT-MAP.md'
      - '**/CONTEXT.md'
      - '**/docs/**/*.md'
      - '**/README*'
      - 'SECURITY*'
      - 'CODE_OF_CONDUCT*'
      - 'CHANGELOG*'
      - '**/CHANGELOG*'

jobs:
  pr-validation:
    uses: salesforcecli/github-workflows/.github/workflows/validatePR.yml@main
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
          cache: npm
      - uses: salesforcecli/github-workflows/.github/actions/npmInstallWithRetries@main
      - run: npm run compile -w @salesforce/eslint-plugin-vscode-extensions
        name: Compile ESLint rules
      - name: Lint
        run: npm run lint
  validate-actions:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
          cache: npm
      - uses: salesforcecli/github-workflows/.github/actions/npmInstallWithRetries@main
      - name: Validate GitHub Actions
        run: npm run check:actions
  check-knip:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
          cache: npm
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: salesforcecli/github-workflows/.github/actions/npmInstallWithRetries@main
      - name: Check knip
        run: npm run check:knip
  check-effect-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
          cache: npm
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: salesforcecli/github-workflows/.github/actions/npmInstallWithRetries@main
      - name: Check Effect LS diagnostics
        run: npm run check:effect-diagnostics
