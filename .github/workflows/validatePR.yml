name: Validate PR
on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: [develop]
    paths-ignore:
      - '.claude/**'
      - '.cursor/**'
      - 'contributing/**'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'CONTEXT.md'
      - 'CONTEXT-MAP.md'
      - '**/CONTEXT.md'
      - '**/docs/**/*.md'
      - '**/README*'
      - 'SECURITY*'
      - 'CODE_OF_CONDUCT*'
      - 'CHANGELOG*'
      - '**/CHANGELOG*'

jobs:
  pr-validation:
    uses: salesforcecli/github-workflows/.github/workflows/validatePR.yml@main
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
          install: 'false'
      - uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          command: pnpm install --frozen-lockfile
      - run: pnpm --filter @salesforce/eslint-plugin-vscode-extensions compile
        name: Compile ESLint rules
      - name: Lint
        run: pnpm lint
  validate-actions:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
          install: 'false'
      - uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          command: pnpm install --frozen-lockfile
      - name: Validate GitHub Actions
        run: pnpm check:actions
  check-knip:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
          install: 'false'
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          command: pnpm install --frozen-lockfile
      - name: Check knip
        run: pnpm check:knip
  check-effect-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
          install: 'false'
      - uses: google/wireit@setup-github-actions-caching/v2
      - uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          command: pnpm install --frozen-lockfile
      - name: Check Effect LS diagnostics
        run: pnpm check:effect-diagnostics
