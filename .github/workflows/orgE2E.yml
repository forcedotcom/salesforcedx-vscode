name: Org E2E (Playwright)

on:
  workflow_dispatch:
    inputs:
      vscode_version:
        description: 'VS Code version for E2E (e.g. 1.116.0). Empty uses repo variable
          PLAYWRIGHT_VSCODE_VERSION.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      vscode_version:
        description: 'VS Code version for E2E (e.g. 1.116.0). Empty uses repo variable
          PLAYWRIGHT_VSCODE_VERSION.'
        required: false
        type: string
        default: ''
  push:
    branches-ignore: [ main, develop ]
    paths-ignore:
      - '.claude/**'
      - '.cursor/**'
      - 'contributing/**'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'CONTEXT.md'
      - 'CONTEXT-MAP.md'
      - '**/CONTEXT.md'
      - '**/docs/**/*.md'
      - '**/README*'
      - 'SECURITY*'
      - 'CODE_OF_CONDUCT*'
      - 'CHANGELOG*'
      - '**/CHANGELOG*'

concurrency:
  group: ci-${{ github.ref }}-orgE2E
  cancel-in-progress: true

jobs:
  e2e-desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ macos-latest, windows-latest ]
      fail-fast: false

    env:
      VSCODE_DESKTOP: 1
      E2E_FROM_VSIX: 1
      MINIMAL_ORG_ALIAS: minimalTestOrg
      # Dedicated throwaway org for the real-logout step; pre-seeded so tryUseExistingOrg hits and
      # createThrowawayOrg never reaches requireOrgInCI. The test logs it out; CI re-seeds each run.
      THROWAWAY_ORG_ALIAS: logoutThrowawayOrg
      # Second throwaway, set AS default and logged out by the logout.default step (W-23069609).
      DEFAULT_LOGOUT_ORG_ALIAS: logoutDefaultThrowawayOrg
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_E2E }}
      # sf CLI hides authFields from `sf org create scratch --json` output by default; tests need them.
      SF_TEMP_SHOW_SECRETS: true
      PLAYWRIGHT_VSCODE_VERSION: ${{ github.event_name != 'push' &&
        inputs.vscode_version != '' && inputs.vscode_version ||
        vars.PLAYWRIGHT_VSCODE_VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Log desktop VS Code version
        shell: bash
        run: echo "::notice::VS Code version=${PLAYWRIGHT_VSCODE_VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: 'npm'

      - uses: google/wireit@setup-github-actions-caching/v2

      - name: Install dependencies
        uses: salesforcecli/github-workflows/.github/actions/npmInstallWithRetries@main

      # Try E2E tests first. When wireit cache hits, it skips the command and exits 0—we never need CLI, orgs, or Playwright.
      # When cache misses, tests fail on missing org/chromium. E2E_NO_RETRIES=1 disables Playwright retries in config
      # so failures are fast (env var doesn't affect wireit cache key since it's not part of the npm command).
      - name: Try E2E tests
        id: try-run
        continue-on-error: true
        timeout-minutes: 5
        env:
          CI: 1
          VSCODE_DESKTOP: 1
          E2E_NO_RETRIES: 1
        run: |
          npm run test:desktop -w salesforcedx-vscode-org

      # Only run expensive setup when try-run failed (cache miss). On cache hit we never reach these steps.
      - name: Install Salesforce CLI
        if: steps.try-run.outcome == 'failure'
        uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          max_attempts: 3
          command: npm i -g @salesforce/cli@${{ vars.SF_CLI_VERSION || 'latest' }}
          retry_wait_seconds: 30

      - name: Install Playwright and create scratch orgs
        if: steps.try-run.outcome == 'failure'
        shell: bash
        run: |
          retry() {
            local retry_wait_seconds=$1
            local attempt command_pid timeout_pid
            shift
            for attempt in 1 2 3; do
              "$@" &
              command_pid=$!
              (sleep 3600; kill -KILL "$command_pid" 2>/dev/null) &
              timeout_pid=$!
              if wait "$command_pid"; then
                kill "$timeout_pid" 2>/dev/null || true
                wait "$timeout_pid" 2>/dev/null || true
                return 0
              fi
              kill "$timeout_pid" 2>/dev/null || true
              wait "$timeout_pid" 2>/dev/null || true
              if [ "$attempt" -lt 3 ]; then sleep "$retry_wait_seconds"; fi
            done
            return 1
          }

          retry 60 npx playwright install chromium --with-deps &
          playwright_pid=$!

          (
            sf project generate -n minimal-project
            retry 30 bash -c 'echo "$SFDX_AUTH_URL" | sf org login sfdx-url --set-default-dev-hub --alias hub --sfdx-url-stdin'
            cd minimal-project
            sf org create scratch -y 1 -d -f config/project-scratch-def.json -a "$MINIMAL_ORG_ALIAS" --json
            # Pre-seed both aliases so the logout tests use these orgs instead of creating orgs in CI.
            sf org create scratch -y 1 -f config/project-scratch-def.json -a "$THROWAWAY_ORG_ALIAS" --json
            sf org create scratch -y 1 -f config/project-scratch-def.json -a "$DEFAULT_LOGOUT_ORG_ALIAS" --json
          ) &
          scratch_org_setup_pid=$!

          failed=0
          wait "$playwright_pid" || failed=1
          wait "$scratch_org_setup_pid" || failed=1
          exit "$failed"

      - name: Run Org E2E tests (parallel)
        if: steps.try-run.outcome == 'failure'
        id: parallel-run
        continue-on-error: true
        env:
          CI: 1
          VSCODE_DESKTOP: 1
        run: |
          npm run test:desktop -w salesforcedx-vscode-org

      - name: Retry failed tests (sequential)
        if: steps.try-run.outcome == 'failure' && steps.parallel-run.outcome ==
          'failure'
        env:
          CI: 1
          VSCODE_DESKTOP: 1
          PLAYWRIGHT_WORKERS: 1
        run: |
          npm run test:desktop -w salesforcedx-vscode-org -- --last-failed

      - name: Copy span files to test-results
        if: always()
        shell: bash
        run: |
          mkdir -p packages/salesforcedx-vscode-org/test-results/spans
          cp -r ~/.sf/vscode-spans/. packages/salesforcedx-vscode-org/test-results/spans/ 2>/dev/null || true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-org-desktop-${{ matrix.os }}
          path: packages/salesforcedx-vscode-org/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-org-desktop-${{ matrix.os }}
          path: packages/salesforcedx-vscode-org/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup scratch org
        if: always() && steps.try-run.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          sf org delete scratch -o "$MINIMAL_ORG_ALIAS" --no-prompt || true
          # best-effort: the real-logout test logs this org out (not delete); reap the scratch org here.
          sf org delete scratch -o "$THROWAWAY_ORG_ALIAS" --no-prompt || true
          # logout.default test logs this org out too; reap it here.
          sf org delete scratch -o "$DEFAULT_LOGOUT_ORG_ALIAS" --no-prompt || true
