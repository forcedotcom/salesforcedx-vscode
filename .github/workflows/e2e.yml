name: End to End Tests
on:
  workflow_run:
    workflows:
      - Nightly Build Develop
      - Test, Build, and Release
      - Create and Test Beta Release Branch
    types:
      - completed

  workflow_call:
    inputs:
      vscodeVersion:
        description: 'VSCode Version'
        required: false
        type: string
      runId:
        description: 'Run ID of the workflow run that created the vsixes'
        required: true
        type: string

  workflow_dispatch:
    inputs:
      vscodeVersion:
        description: 'VSCode Version'
        required: false
        type: string
      runId:
        description: 'Run ID of the workflow run that created the vsixes'
        required: true
        type: string

jobs:
  # calculate-min-vscode-version: removed with LSP_min_vscode_version (its only consumer) — W-22973351

  # LSP / LSP_min_vscode_version: removed — lspE2E.yml deleted once its last WDIO suite (auraLsp.e2e)
  # migrated to Playwright (auraE2E.yml, run via playwright-aura below). lwc/visualforce LSP suites
  # were migrated earlier. — W-22973351

  playwright-vscode-ext:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/playwrightVscodeExtE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  playwright-services:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/servicesE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  playwright-metadata:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/metadataE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  playwright-apex-log:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/apexLogE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  playwright-apex-testing:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/apexTestingE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  playwright-apex-oas:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/apexOasE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  playwright-org:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/orgE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  playwright-org-browser:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/orgBrowserE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  playwright-soql:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/soqlE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  playwright-core:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/coreE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  playwright-apex-replay-debugger:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/apexReplayDebuggerE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  playwright-apex-debugger:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/apexDebuggerE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  playwright-visualforce:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/visualforceE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  playwright-aura:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/auraE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  playwright-lwc:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/lwcPlaywrightE2E.yml
    secrets: inherit
    with:
      vscode_version: ${{ inputs.vscodeVersion }}

  # Code Builder e2e — container suite against the real CB image. ADVISORY (plan §10.4): a red here
  # is a signal to investigate, not an automatic release stop. Advisory is enforced by keeping this
  # a NON-REQUIRED status check (branch/release protection settings) — GitHub does not allow
  # continue-on-error on a reusable-workflow (`uses:`) job, so it can't be set here. Threads the
  # build runId (the run that produced the VSIXes) like the other leaves; needs no vscode_version
  # (it runs the shipping VSIX inside the container, not a desktop VS Code). — W-23898524
  playwright-code-builder:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    uses: ./.github/workflows/codeBuilderE2E.yml
    secrets: inherit
    with:
      runId: ${{ inputs.runId || github.event.workflow_run.id }}

  # LSP_min_vscode_version: removed with lspE2E.yml (see note above) — W-22973351
