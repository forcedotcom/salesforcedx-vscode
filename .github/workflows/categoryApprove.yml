name: Category Approve

on:
  check_run:
    types: [completed]
  pull_request:
    types: [opened, ready_for_review, reopened, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: category-approve-${{ github.event.check_run.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  category-approve:
    # Own check runs and fork PRs must not start a run (forks have no IDEE_GH_TOKEN).
    # Title/body edits, comment-only reviews, and svc-idee-bot's own approvals do not change a skip gate.
    if: >-
      (github.event_name == 'check_run' && github.event.check_run.name != 'category-approve' &&
      (github.event.check_run.pull_requests[0].head.repo.full_name == github.repository || github.event.check_run.pull_requests[0] == null)) ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false &&
      ((github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base.ref.from)) ||
      (github.event_name == 'pull_request_review' && (github.event.action == 'dismissed' ||
       ((github.event.review.state == 'APPROVED' || github.event.review.state == 'approved') &&
       github.event.review.user.login != 'svc-idee-bot'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check pre-classify gates
        id: preflight
        env:
          IDEE_GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
        run: node scripts/category-approve-preflight.mjs
      - uses: actions/checkout@v4
        if: steps.preflight.outputs.run == 'true'
        with:
          ref: ${{ github.event.check_run.head_sha || github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
        if: steps.preflight.outputs.run == 'true'
        with:
          node-version: 24
      - name: Compile effect-octokit
        if: steps.preflight.outputs.run == 'true'
        run: pnpm --filter @salesforce/effect-octokit compile
      - name: Install Cursor CLI
        if: steps.preflight.outputs.run == 'true'
        run: curl https://cursor.com/install -fsS | bash
      - name: Decide and approve
        if: steps.preflight.outputs.run == 'true'
        working-directory: pr
        env:
          IDEE_GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.IDEE_CURSOR_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node ../scripts/categoryApprove.mts
