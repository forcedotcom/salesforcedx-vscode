name: Promote to Pre-release

on:
  schedule:
    # Wednesdays 8 AM UTC: promote most recent CI-passing nightly to marketplace prerelease.
    # trigger-stable-build (below) then chains the stable build off this exact commit, pinned
    # via prereleaseTag -- publishing to the Marketplace is a separate human decision. -- W-24610381
    - cron: '0 8 * * 3'
  workflow_dispatch:
    inputs:
      releaseTag:
        description: 'Specific release tag to publish (e.g., v67.13.7-nightly.develop.20260820). Leave empty to auto-detect most recent CI-passing nightly.'
        required: false
        type: string
      isHotfix:
        description: 'Skip nightly-pipeline gate-check for tags built via build-github-release.yml startFromRef, and instead test the exact commit here directly (see "Checkout hotfix commit" below). Do not use for regular nightly tags.'
        required: false
        default: false
        type: boolean
      dry-run:
        description: 'Run in dry-run mode (no actual publishing or tagging)'
        required: false
        default: false
        type: boolean

# NOTE: Concurrency is handled by the reusable workflow (vscode-promote-prerelease.yml)
# Do not define it here to avoid deadlock

permissions:
  contents: write
  packages: write
  actions: read
  checks: read

jobs:
  # Step 1: Find nightly candidate (THIS REPO CONTROLS CRITERIA)
  find-nightly:
    uses: salesforcecli/github-workflows/.github/workflows/vscode-find-nightly-candidate.yml@main
    with:
      release-tag: ${{ inputs.releaseTag || '' }}
      min-tag-age-days: '0'

  # Step 2: Gate-check CI status (THIS REPO CONTROLS CRITERIA)
  gate-check:
    needs: find-nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to check out an arbitrary hotfix commit-sha below

      - name: Check CI status
        # Gates on the nightly's own build/release check-runs, not unit-tests/build-all:
        # those ran on the PR head commit via validatePR.yml, which no longer exists after
        # squash-merge. Skipped for isHotfix since startFromRef tags never go through this
        # nightly pipeline -- see "Checkout hotfix commit" below instead.
        if: ${{ !inputs.isHotfix }}
        uses: salesforcecli/github-workflows/.github/actions/vscode/check-ci-status@main
        with:
          commit-sha: ${{ needs.find-nightly.outputs.commit-sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          required-checks: '["nightly-release / package / Package", "nightly-release / Create GitHub Releases"]'

      - name: Setup Node.js
        if: ${{ inputs.isHotfix }}
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
          install: 'false'

      - name: Checkout hotfix commit
        # Hotfix commits have no nightly-pipeline check-runs, so verify by checking out the
        # exact commit and running the same compile+test gate branch protection would require.
        if: ${{ inputs.isHotfix }}
        env:
          COMMIT_SHA: ${{ needs.find-nightly.outputs.commit-sha }}
        run: git checkout "$COMMIT_SHA"

      - name: Install dependencies for hotfix commit
        if: ${{ inputs.isHotfix }}
        uses: salesforcecli/github-workflows/.github/actions/pnpmInstallWithRetries@main
      - name: Run tests for hotfix commit
        if: ${{ inputs.isHotfix }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          WIREIT_PARALLEL: 1
        run: |
          pnpm compile
          pnpm test

  # Step 3a: Find this week's changelog range (fromRef, toRef] so steps 3b/3c cover identical commits.
  # Runs in dry-run too (for log preview); only Step 3c's actual write/commit is skipped.
  compute-changelog-range:
    needs: [find-nightly, gate-check]
    if: always() && needs.gate-check.result == 'success'
    runs-on: ubuntu-latest
    env:
      NIGHTLY_SHA: ${{ needs.find-nightly.outputs.commit-sha }}
    outputs:
      from-ref: ${{ steps.range.outputs.from-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine previous prerelease baseline
        # Newest marketplace-prerelease-* tag if present, else last stable release tag.
        # Emits empty from-ref when that baseline equals the commit being promoted (e.g. a
        # re-run) -- changelogBody.mts treats identical refs as a hard error, so this keeps
        # it a no-op instead of a spurious failure.
        id: range
        run: |
          FROM_REF=$(git tag -l 'marketplace-prerelease-*' --sort=-creatordate | head -1)
          if [ -z "$FROM_REF" ]; then
            FROM_REF=$(git tag -l 'v[0-9]*' --sort=-version:refname | grep -v -- '-nightly\.' | head -1)
          fi
          if [ -z "$FROM_REF" ]; then
            echo "::error::Could not auto-detect a previous prerelease baseline."
            exit 1
          fi

          FROM_SHA=$(git rev-parse --verify "${FROM_REF}^{commit}")
          if [ "$FROM_SHA" = "$NIGHTLY_SHA" ]; then
            echo "Baseline $FROM_REF is the exact commit being promoted -- nothing new for the changelog."
            echo "from-ref=" >> "$GITHUB_OUTPUT"
          else
            echo "from-ref=$FROM_REF" >> "$GITHUB_OUTPUT"
          fi

  # Step 3b: Turn this week's commits into a polished, customer-facing changelog body via
  # .github/workflows/changelog-body.yml (Cursor-backed; strips GUS refs, dedupes packages).
  changelog-body:
    needs: [find-nightly, compute-changelog-range]
    # Skip rather than call changelogBody.mts with identical from/to refs (hard error there).
    if: always() && needs.compute-changelog-range.result == 'success' && needs.compute-changelog-range.outputs.from-ref != ''
    uses: ./.github/workflows/changelog-body.yml
    with:
      from: ${{ needs.compute-changelog-range.outputs.from-ref }}
      to: ${{ needs.find-nightly.outputs.commit-sha }}
    secrets: inherit

  # Step 3c: Bake the polished body into the prerelease VSIX and commit it to develop's
  # CHANGELOG.md. Must complete before `promote`, since that reusable workflow re-downloads
  # this exact release asset.
  write-changelog:
    needs: [find-nightly, gate-check, changelog-body]
    # Custom `if:` replaces the implicit needs-success gate, so gate-check must be re-checked.
    # changelog-body is allowed through when skipped (dry-run, or no new commits) too.
    if: always() && needs.gate-check.result == 'success' && (needs.changelog-body.result == 'success' || needs.changelog-body.result == 'skipped') && inputs.dry-run != true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
      NIGHTLY_TAG: ${{ needs.find-nightly.outputs.nightly-tag }}
      NIGHTLY_SHA: ${{ needs.find-nightly.outputs.commit-sha }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.IDEE_GH_TOKEN }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
          install: 'false'

      - uses: ./.github/actions/gitConfig
        with:
          email: ${{ secrets.IDEE_GH_EMAIL }}

      - name: Determine prerelease version
        id: version
        run: |
          VERSION=$(echo "$NIGHTLY_TAG" | grep -oP '\d+\.\d+\.\d+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from nightly tag: $NIGHTLY_TAG"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Write this week's polished changelog delta
        # Header format must match what scripts/prepend-release-changelog.js expects.
        id: delta
        env:
          PRERELEASE_VERSION: ${{ steps.version.outputs.version }}
          BODY: ${{ needs.changelog-body.outputs.body }}
        run: |
          if [ -z "$BODY" ]; then
            echo "No qualifying commits in this week's range. Skipping changelog generation."
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            RELEASE_DATE=$(date -d '+7 days' '+%B %-d, %Y')
            {
              echo "# $PRERELEASE_VERSION - $RELEASE_DATE"
              echo
              echo "$BODY"
            } > packages/salesforcedx-vscode/CHANGELOG.md
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Inject changelog into the prerelease VSIX
        # Skip if nothing generated, to avoid re-shipping last week's changelog mislabeled.
        if: steps.delta.outputs.generated == 'true'
        env:
          PRERELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VSIX="salesforcedx-vscode-${PRERELEASE_VERSION}.vsix"
          gh release download "$NIGHTLY_TAG" --pattern "$VSIX" --clobber

          # vsce stores the file lowercase inside the vsix; must match exactly or zip
          # adds a second, differently-cased entry instead of replacing this one.
          mkdir -p extension
          cp packages/salesforcedx-vscode/CHANGELOG.md extension/changelog.md
          # -X: omit Unix UID/GID + timestamp extra fields, or Open VSX's scanner blocks the
          # VSIX with "contains zip entries with potentially harmful extra fields".
          zip -X "$VSIX" extension/changelog.md

          gh release upload "$NIGHTLY_TAG" "$VSIX" --clobber

          # --clobber recreates the asset with a new ID that may not be visible via the API
          # within seconds; poll for the new digest so `promote`'s download doesn't 404 on
          # the stale asset.
          LOCAL_DIGEST="sha256:$(sha256sum "$VSIX" | cut -d' ' -f1)"
          for attempt in 1 2 3 4 5; do
            REMOTE_DIGEST=$(gh release view "$NIGHTLY_TAG" --json assets --jq ".assets[] | select(.name == \"$VSIX\") | .digest")
            if [ "$REMOTE_DIGEST" = "$LOCAL_DIGEST" ]; then
              echo "✅ Asset $VSIX visible with matching digest after $attempt attempt(s)"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Asset $VSIX did not converge to the re-uploaded digest after 5 attempts"
              echo "::error::Expected: $LOCAL_DIGEST"
              echo "::error::Got: $REMOTE_DIGEST"
              exit 1
            fi
            echo "⏳ Asset $VSIX not yet visible with new digest (attempt $attempt/5) -- retrying in 5s"
            sleep 5
          done

          rm -rf extension "$VSIX"

      - name: Prepend delta to root CHANGELOG (full history)
        if: steps.delta.outputs.generated == 'true'
        run: node scripts/prepend-release-changelog.js

      - name: Commit changelog delta to develop
        if: steps.delta.outputs.generated == 'true'
        uses: ./.github/actions/commitAndPushToDevelop
        with:
          files: packages/salesforcedx-vscode/CHANGELOG.md CHANGELOG.md
          message: "chore: changelog for prerelease v${{ steps.version.outputs.version }} [skip ci]"

  # Step 4: Promote to prerelease. write-changelog may be skipped (dry-run), so allow that
  # through too -- otherwise dry-run would never reach the reusable workflow's dry-run path.
  promote:
    needs: [find-nightly, gate-check, write-changelog]
    if: always() && needs.gate-check.result == 'success' && (needs.write-changelog.result == 'success' || needs.write-changelog.result == 'skipped')
    uses: salesforcecli/github-workflows/.github/workflows/vscode-promote-prerelease.yml@main
    with:
      release-tag: ${{ needs.find-nightly.outputs.nightly-tag }}
      vsix-name-pattern: 'salesforcedx-vscode-*.vsix'
      exclude-web-vsix: 'false'
      extension-name: 'salesforcedx-vscode'
      node-version: ${{ vars.NODE_VERSION || 'lts/*' }}
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit

  # Step 5: Chain the stable candidate off this exact prerelease, pinning prereleaseTag
  # explicitly rather than relying on build-github-release.yml's own auto-detect (which drifted
  # from "last week's" tag once the scheduled crons started failing -- see v68.6.0). The
  # resulting candidate's actual Marketplace publish is a separate PagerDuty decision, not
  # enforced here. Skipped in dry-run (no dry path exists downstream) and for isHotfix (a
  # hotfix tag isn't nightly-shaped and shouldn't feed a minor-bump stable build; hotfixes
  # publish directly via publishVSCode.yml/publishOpenVSX.yml). -- W-24610381
  trigger-stable-build:
    needs: [find-nightly, write-changelog, promote]
    if: always() && needs.promote.result == 'success' && (needs.write-changelog.result == 'success' || needs.write-changelog.result == 'skipped') && inputs.dry-run != true && !inputs.isHotfix
    runs-on: ubuntu-latest
    env:
      # A PAT, not GITHUB_TOKEN: GITHUB_TOKEN-triggered dispatches don't reliably cascade
      # into the dispatched run's own tag-push/release-create events.
      GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
      NIGHTLY_TAG: ${{ needs.find-nightly.outputs.nightly-tag }}
    steps:
      - name: Dispatch stable build for this nightly
        run: |
          gh workflow run build-github-release.yml \
            --repo "${{ github.repository }}" \
            --ref develop \
            -f prereleaseTag="$NIGHTLY_TAG"

  # Step 6: Mark the nightly release as published (promote only publishes VSIXs, never
  # touches the nightly release's own title).
  mark-release-published:
    needs: [find-nightly, promote]
    if: always() && needs.promote.result == 'success' && inputs.dry-run != true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NIGHTLY_TAG: ${{ needs.find-nightly.outputs.nightly-tag }}
    steps:
      - name: Append "- published" to release title
        run: |
          CURRENT_TITLE=$(gh release view "$NIGHTLY_TAG" --repo "${{ github.repository }}" --json name --jq .name)
          if [[ "$CURRENT_TITLE" == *" - published" ]]; then
            echo "⏭️ Release already marked published — skipping (idempotent rerun)"
          else
            gh release edit "$NIGHTLY_TAG" --repo "${{ github.repository }}" --title "$CURRENT_TITLE - published"
            echo "Renamed release title to: $CURRENT_TITLE - published"
          fi

  # Step 7: Notify Slack (Workflow Builder webhook trigger, not a classic incoming webhook --
  # payload is the flat input-variable set, not Block Kit) on any job failure above.
  notify-on-failure:
    needs:
      [
        find-nightly,
        gate-check,
        compute-changelog-range,
        changelog-body,
        write-changelog,
        promote,
        trigger-stable-build,
        mark-release-published
      ]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.IDEE_PROMOTE_PRERELEASE_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg title ':x: Prerelease publishing failed' --arg run_url "$RUN_URL" --arg repository "$REPOSITORY" '{title: $title, run_url: $run_url, repository: $repository}')"

  # Mirrors notify-on-failure but for success. Gated on dry-run != true too: mark-release-published
  # is itself skipped in dry-run, and a skipped need doesn't count against success(), so without
  # this a dry-run would falsely announce success.
  notify-on-success:
    needs:
      [
        find-nightly,
        gate-check,
        compute-changelog-range,
        changelog-body,
        write-changelog,
        promote,
        trigger-stable-build,
        mark-release-published
      ]
    if: success() && inputs.dry-run != true
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.IDEE_PROMOTE_PRERELEASE_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg title ':check-green: Prerelease publishing succeeded :rocket:' --arg run_url "$RUN_URL" --arg repository "$REPOSITORY" '{title: $title, run_url: $run_url, repository: $repository}')"
