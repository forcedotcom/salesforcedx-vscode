name: Cleanup Deleted Scratch Orgs

on:
  workflow_dispatch: # Allow manual trigger
  schedule:
    - cron: '0 * * * *' # Run hourly to drain the backlog

jobs:
  cleanup-scratch-orgs:
    runs-on: ubuntu-latest

    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL_E2E }}
      SF_ORG_MAX_QUERY_LIMIT: 50000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}

      - name: Install Salesforce CLI
        uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          max_attempts: 3
          command: npm install -g @salesforce/cli@${{ vars.SF_CLI_VERSION || 'latest' }}
          retry_wait_seconds: 30

      - name: Verify Salesforce CLI
        run: sf --version

      - name: Authenticate with Salesforce
        uses: salesforcecli/github-workflows/.github/actions/retry@main
        with:
          max_attempts: 3
          command: bash -c 'echo "Authenticating with Salesforce org..." && echo "$SFDX_AUTH_URL" | sf org login sfdx-url --alias vscodeOrg --set-default --sfdx-url-stdin'
          retry_wait_seconds: 30

      - name: Export and delete scratch org records
        id: cleanup
        run: |
          CUTOFF=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          echo "cutoff=$CUTOFF" >> "$GITHUB_OUTPUT"

          sf data query \
            --query "SELECT Id FROM ScratchOrgInfo WHERE Status = 'Deleted' AND LastModifiedDate < $CUTOFF LIMIT 50000" \
            --target-org vscodeOrg \
            --result-format csv \
            --output-file deleted_scratch_orgs.csv

          RECORD_COUNT=$(awk 'END { print NR ? NR - 1 : 0 }' deleted_scratch_orgs.csv)
          echo "candidate_count=$RECORD_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$RECORD_COUNT" -eq 0 ]; then
            echo "No deleted scratch org records older than $CUTOFF to clean up"
            echo "processed_count=0" >> "$GITHUB_OUTPUT"
            echo "failed_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Deleting $RECORD_COUNT deleted scratch org records older than $CUTOFF"
          DELETE_STATUS=0
          sf data delete bulk \
            --sobject ScratchOrgInfo \
            --target-org vscodeOrg \
            --file deleted_scratch_orgs.csv \
            --wait 10 \
            --json > delete_result.json || DELETE_STATUS=$?

          PROCESSED=$(jq -er '.result.jobInfo.numberRecordsProcessed' delete_result.json)
          FAILED=$(jq -er '.result.jobInfo.numberRecordsFailed' delete_result.json)
          echo "processed_count=$PROCESSED" >> "$GITHUB_OUTPUT"
          echo "failed_count=$FAILED" >> "$GITHUB_OUTPUT"
          echo "Processed: $PROCESSED, failed: $FAILED"
          jq -e '.result.jobInfo.state == "JobComplete"' delete_result.json > /dev/null
          if [ "$DELETE_STATUS" -ne 0 ] || [ "$PROCESSED" -ne "$RECORD_COUNT" ] || [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Logout from Salesforce
        if: always()
        run: |
          sf org logout --target-org vscodeOrg --no-prompt || true

      - name: Workflow summary
        if: always()
        run: |
          echo "## Scratch Org Cleanup Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cutoff (UTC):** ${{ steps.cleanup.outputs.cutoff || 'not available' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CSV Records:** ${{ steps.cleanup.outputs.candidate_count || 'not available' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Processed Records:** ${{ steps.cleanup.outputs.processed_count || 'not available' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Failed Records:** ${{ steps.cleanup.outputs.failed_count || 'not available' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Timestamp:** $(date -u)" >> "$GITHUB_STEP_SUMMARY"
