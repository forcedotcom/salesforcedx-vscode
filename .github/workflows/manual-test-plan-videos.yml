name: Manual Test Plan Videos

# Privileged updater: run only default-branch code. Artifact contents are data, never code.
on:
  check_suite:
    types: [completed]
  workflow_run:
    workflows:
      - Validate PR
      - Commit Workflow
      - Apex Debugger E2E (Playwright)
      - Apex Log E2E (Playwright)
      - Apex LSP E2E (Playwright)
      - Apex OAS E2E (Playwright)
      - Apex Replay Debugger E2E (Playwright)
      - Apex Testing E2E (Playwright)
      - Aura E2E (Playwright)
      - Core E2E (Playwright)
      - LWC E2E (Playwright)
      - Metadata E2E (Playwright)
      - Org E2E (Playwright)
      - OrgBrowser E2E (Playwright)
      - Playwright VS Code Ext E2E Tests
      - Services E2E (Playwright)
      - SOQL E2E (Playwright)
      - Visualforce E2E (Playwright)
      - Apex Consumer NUTs
      - Doc-Only Auto-Merge
      - Build and Test
      - Unit Tests
      - Unit Tests Linux
      - Unit Tests Windows
      - End to End Tests
      - Rerun Push E2E
      - Code Builder E2E (Playwright)
      - Playwright E2E Full Suite
      - Manual test plan
    types: [completed]
  pull_request_target:
    types: [synchronize]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Open PR number to update
        type: string
        required: true

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  pull-requests: read

jobs:
  resolve:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      pulls: ${{ steps.resolve.outputs.pulls }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24
      - run: pnpm --filter @salesforce/effect-octokit compile
      - name: Resolve current open PR heads
        id: resolve
        env:
          IDEE_GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
        run: node scripts/manualTestPlan/manualTestPlanVideos.mts resolve

  videos:
    needs: resolve
    if: needs.resolve.outputs.pulls != '[]'
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.resolve.outputs.pulls) }}
    # Same group as manual-test-plan.yml; no concurrent PR body writers.
    concurrency:
      group: manual-test-plan-${{ matrix.pull.pr }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24
      - run: pnpm --filter @salesforce/effect-octokit compile
      - name: Confirm GitHub CLI attachment support
        run: gh pr edit --help | grep -- --attach
      - name: Update generated videos
        env:
          IDEE_GH_TOKEN: ${{ secrets.IDEE_GH_TOKEN }}
          VIDEO_PR: ${{ matrix.pull.pr }}
          VIDEO_SHA: ${{ matrix.pull.sha }}
          VIDEO_CLEAR: ${{ matrix.pull.clear }}
        run: node scripts/manualTestPlan/manualTestPlanVideos.mts
