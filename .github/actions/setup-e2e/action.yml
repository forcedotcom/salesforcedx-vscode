name: Setup E2E
description: Set up Node.js, pnpm, Wireit caching, and dependencies
inputs:
  node-version:
    description: Node.js version passed by the calling workflow
    required: false
    default: 'lts/*'
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: ./.github/actions/setup-pnpm
      with:
        node-version: ${{ inputs.node-version }}
    - uses: google/wireit@setup-github-actions-caching/v2
