name: 'Salesforce Extensions New Issues Bot'
description: 'Send an automatic response to newly created Github issues.'
author: 'Daphne Yang'
inputs:
  repo-token:
    required: true
    description: 'Token taken from secrets env var'
  message:
    required: false
    description: 'Message to post in issue comment'
  should-process-issue:
    required: false
    default: 'true'
    description: 'Whether to post the issue acknowledgement'
runs:
  using: 'node24'
  main: 'lib/index.js'
