name: 'Preserve Release Scripts'
description: 'Preserve and restore release scripts with integrity verification across git checkouts'
inputs:
  mode:
    description: 'Operation mode: "save" or "restore"'
    required: true
  scripts:
    description: 'Space-separated list of script paths relative to repo root (e.g., "scripts/foo.js scripts/bar.js")'
    required: true
    default: 'scripts/calculate-release-version.js scripts/update-release-versions.js'

runs:
  using: 'composite'
  steps:
    - name: Save scripts
      if: inputs.mode == 'save'
      shell: bash
      run: |
        # Copy scripts to temp location for restoration after checkout
        mkdir -p /tmp/release-scripts

        # Copy each script
        for script in ${{ inputs.scripts }}; do
          if [ ! -f "$script" ]; then
            echo "::error::Script not found: $script"
            exit 1
          fi
          cp "$script" /tmp/release-scripts/
          echo "✓ Saved: $script"
        done

        # Generate checksums for integrity verification
        cd "$(dirname ${{ inputs.scripts }} | head -1)"
        sha256sum $(basename -a ${{ inputs.scripts }}) > /tmp/release-scripts/checksums.txt
        cd - > /dev/null

        echo "Generated checksums:"
        cat /tmp/release-scripts/checksums.txt

    - name: Restore scripts
      if: inputs.mode == 'restore'
      shell: bash
      run: |
        # Restore scripts from temp location
        FIRST_SCRIPT_DIR=$(dirname $(echo "${{ inputs.scripts }}" | awk '{print $1}'))
        mkdir -p "$FIRST_SCRIPT_DIR"

        # Verify all scripts exist in temp
        for script in ${{ inputs.scripts }}; do
          SCRIPT_NAME=$(basename "$script")
          if [ ! -f "/tmp/release-scripts/$SCRIPT_NAME" ]; then
            echo "::error::Script not found in /tmp/release-scripts/: $SCRIPT_NAME"
            exit 1
          fi
        done

        # Restore each script
        for script in ${{ inputs.scripts }}; do
          SCRIPT_NAME=$(basename "$script")
          cp "/tmp/release-scripts/$SCRIPT_NAME" "$script"
          echo "✓ Restored: $script"
        done

        # Verify integrity with checksums
        cd "$FIRST_SCRIPT_DIR"
        if ! sha256sum -c /tmp/release-scripts/checksums.txt 2>/dev/null; then
          echo "::error::Script integrity check failed - checksums do not match"
          exit 1
        fi
        cd - > /dev/null
        echo "✓ Script integrity verified"
