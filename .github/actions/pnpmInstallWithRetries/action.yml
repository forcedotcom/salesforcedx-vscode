name: pnpm install with retries
description: Install frozen pnpm dependencies with retries in a specified working directory
inputs:
  working-directory:
    description: Directory containing the package manifest and lockfile
    required: false
    default: .
runs:
  using: composite
  steps:
    # The shared pnpmInstallWithRetries action does not support a working directory.
    - name: Install dependencies
      uses: salesforcecli/github-workflows/.github/actions/retry@main
      env:
        PNPM_INSTALL_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      with:
        command: cd "$PNPM_INSTALL_WORKING_DIRECTORY" && pnpm install --frozen-lockfile
