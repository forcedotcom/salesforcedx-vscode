  - id: .github/workflows/e2e.yml:4f436dbe760c062b3a67bee3db777800233c6eb9715d2b825018a3806993c204
    justification: >
      `secrets: inherit` here calls a reusable workflow in this same repository
      (./.github/workflows/*.yml), so the callee is first-party code reviewed in the same PR flow,
      not an external workflow. The e2e jobs need several org/auth secrets, and this is the
      established pattern already used by the existing e2e.yml, playwrightE2EFullSuite.yml and
      publish workflows on develop; enumerating each secret would only add drift risk.
